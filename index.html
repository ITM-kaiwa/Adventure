  /* ---- (A) ユーザー情報データベース閲覧 ----
     ユーザー名(ヒーロー名)・ライフ・経験値・ゴールド・マップ番号・持っているアイテムの種類と
     数を一覧表示する。表示項目からメールアドレスは除外している(ユーザー確認済み: 2026-08-24・
     29回目「メールアドレスは項目に含めなくてよい」)。データはSupabaseのgame_savesテーブルを
     全件取得(user_idで絞り込まない)して取得するため、Supabase側のRLS(行レベルセキュリティ)
     ポリシーがこの管理者アカウントに対して全行のSELECTを許可している必要がある(通常のプレイ中の
     保存/読み込みは自分の行のみに絞り込んでいるため、これは管理者専用の追加設定が必要)。
     また、この画面はログイン済み(auth.user有り)であることが前提。 */
  function openAdminUserDatabase(returnTo){
    activeModalRenderer = ()=> openAdminUserDatabase(returnTo);
    async function render(){
      openModal(`
        <div class="card admin-wide-card">
          <div class="badge">👥 ${at("adminUserDbTitle")}</div>
          <p class="scramble-hint">${at("adminUserDbLoading")}</p>
          <button class="secondary" id="utilDbBackBtn">${t("devClose")}</button>
        </div>
      `);
      document.getElementById("utilDbBackBtn").onclick = ()=>{ openAdminUtilityMenu(returnTo); };
      if(!auth.user){
        renderResult(`<p class="feedback no">${at("adminUserDbNeedLogin")}</p>`);
        return;
      }
      try{
        const res = await fetch(REST_URL + "/game_saves?select=user_id,state,updated_at&order=updated_at.desc", {
          headers:{ "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+auth.accessToken }
        });
        if(!res.ok){
          renderResult(`<p class="feedback no">${at("adminUserDbFetchError")}</p>`);
          return;
        }
        const rows = await res.json();
        renderResult(buildTable(rows));
      }catch(e){
        renderResult(`<p class="feedback no">${at("adminUserDbFetchError")}</p>`);
      }
    }
    function itemsSummary(s){
      const items = [];
      if(s.hasOrderScroll) items.push(t("itemOrderScroll"));
      if(s.hasElixir) items.push(t("itemElixir"));
      if(s.herbCount) items.push(`${t("itemHerb")}×${s.herbCount}`);
      if(s.hasAmulet) items.push(t("itemAmulet"));
      if(s.hasClimbingBoots) items.push(t("itemClimbBoots"));
      return items.length ? items.join("、")+`（${items.length}）` : at("adminUserDbNoItems");
    }
    function buildTable(rows){
      if(!rows || rows.length===0){ return `<p class="scramble-hint">${at("adminUserDbEmpty")}</p>`; }
      const head = `<tr>
        <th>${at("adminUserDbColName")}</th><th>${at("adminUserDbColUserId")}</th>
        <th>${at("adminUserDbColLife")}</th><th>${at("adminUserDbColExp")}</th>
        <th>${at("adminUserDbColGold")}</th><th>${at("adminUserDbColMap")}</th>
        <th>${at("adminUserDbColItems")}</th></tr>`;
      const body = rows.map(row=>{
        const s = row.state || {};
        const name = s.heroName && s.heroName.trim() ? s.heroName : at("adminUserDbNoName");
        const shortId = (row.user_id||"").slice(0,8);
        return `<tr>
          <td>${name}</td><td>${shortId}</td>
          <td>${s.life!=null?s.life:"-"}/${s.maxLife!=null?s.maxLife:"-"}</td>
          <td>${s.exp!=null?s.exp:"-"}</td><td>${s.gold!=null?s.gold:"-"}</td>
          <td>${s.currentMap!=null?s.currentMap:"-"}</td>
          <td>${itemsSummary(s)}</td>
        </tr>`;
      }).join("");
      return `<div class="admin-table-wrap"><table class="admin-table">${head}${body}</table></div>
        <p class="scramble-hint">${at("adminUserDbCount", rows.length)}</p>`;
    }
    function renderResult(html){
      openModal(`
        <div class="card admin-wide-card">
          <div class="badge">👥 ${at("adminUserDbTitle")}</div>
          ${html}
          <button class="secondary" id="utilDbBackBtn2">${t("devClose")}</button>
        </div>
      `);
      document.getElementById("utilDbBackBtn2").onclick = ()=>{ openAdminUtilityMenu(returnTo); };
    }
    render();
  }

  /* ---- (B) 全問題閲覧・編集 ----
     LEVELS(全36レベル×normal/hard)の問題を、レベルごとに折りたたみ表示し、各問題文・
     選択肢4つ・正解番号をその場で編集できる。保存は上記のquestionOverrides(localStorage)
     に書き込むのみで、ゲーム本体のソースコード(LEVELS)自体は書き換えない(この管理者端末の
     ブラウザにのみ反映される。全プレイヤーへ配信するには、この編集内容を元にソースコードの
     LEVELSを直接書き換えて再デプロイする必要がある)。 */
  function openAdminQuestionBrowser(returnTo){
    let expandedLv = null;
    activeModalRenderer = ()=> openAdminQuestionBrowser(returnTo);
    function render(msg){
      const levelKeys = Object.keys(LEVELS).map(Number).sort((a,b)=>a-b);
      const listHtml = levelKeys.map(lv=>{
        const title = LEVELS[lv].title;
        const isOpen = expandedLv===lv;
        return `<div class="admin-lv-row">
          <button class="secondary admin-lv-toggle" data-lv="${lv}">${isOpen?"▼":"▶"} LV${lv}: ${title}</button>
          ${isOpen ? buildLevelEditor(lv) : ""}
        </div>`;
      }).join("");
      openModal(`
        <div class="card admin-wide-card">
          <div class="badge">📝 ${at("adminQuestionTitle")}</div>
          <p class="scramble-hint">${at("adminQuestionHint")}</p>
          <div class="feedback ok" id="utilQMsg">${msg||""}</div>
          <div class="admin-lv-list">${listHtml}</div>
          <button class="secondary" id="utilQBackBtn">${t("devClose")}</button>
        </div>
      `);
      document.querySelectorAll(".admin-lv-toggle").forEach(btn=>{
        btn.onclick = ()=>{
          const lv = Number(btn.dataset.lv);
          expandedLv = (expandedLv===lv) ? null : lv;
          render();
        };
      });
      document.getElementById("utilQBackBtn").onclick = ()=>{ openAdminUtilityMenu(returnTo); };
      if(expandedLv!=null){ wireLevelEditor(expandedLv); }
    }
    function buildLevelEditor(lv){
      const pools = ["normal","hard"];
      return pools.map(pool=>{
        const bank = LEVELS[lv][pool] || [];
        return bank.map((baseQ,idx)=>{
          const ov = questionOverrides[lv+":"+pool+":"+idx];
          const cur = ov || baseQ;
          const choicesHtml = cur.c.map((c,ci)=>`
            <div class="admin-choice-row">
              <input type="radio" name="ans-${lv}-${pool}-${idx}" value="${ci}" ${cur.a===ci?"checked":""}>
              <input type="text" class="name-input admin-choice-input" data-lv="${lv}" data-pool="${pool}" data-idx="${idx}" data-ci="${ci}" value="${escapeAttr(c)}">
            </div>`).join("");
          return `<div class="admin-q-card">
            <div class="scramble-hint">${pool==="normal"?at("adminQuestionPoolNormal"):at("adminQuestionPoolHard")} #${idx+1}${ov?" "+at("adminQuestionEditedTag"):""}</div>
            <textarea class="name-input admin-q-textarea" data-lv="${lv}" data-pool="${pool}" data-idx="${idx}" data-field="q">${escapeAttr(cur.q)}</textarea>
            ${choicesHtml}
            <button class="primary admin-q-save" data-lv="${lv}" data-pool="${pool}" data-idx="${idx}" style="margin-top:8px;">${at("adminQuestionSaveBtn")}</button>
            ${ov ? `<button class="secondary admin-q-reset" data-lv="${lv}" data-pool="${pool}" data-idx="${idx}" style="margin-top:8px;">${at("adminQuestionResetBtn")}</button>` : ""}
          </div>`;
        }).join("");
      }).join("");
    }
    function wireLevelEditor(lv){
      document.querySelectorAll(".admin-q-save").forEach(btn=>{
        btn.onclick = ()=>{
          const lv2 = Number(btn.dataset.lv), pool = btn.dataset.pool, idx = Number(btn.dataset.idx);
          const key = lv2+":"+pool+":"+idx;
          const qEl = document.querySelector(`textarea[data-lv="${lv2}"][data-pool="${pool}"][data-idx="${idx}"]`);
          const choiceEls = document.querySelectorAll(`input.admin-choice-input[data-lv="${lv2}"][data-pool="${pool}"][data-idx="${idx}"]`);
          const ansEl = document.querySelector(`input[name="ans-${lv2}-${pool}-${idx}"]:checked`);
          const c = Array.from(choiceEls).map(el=>el.value);
          const a = ansEl ? Number(ansEl.value) : 0;
          questionOverrides[key] = { q: qEl.value, c, a };
          saveQuestionOverrides(questionOverrides);
          render(at("adminQuestionSaved"));
        };
      });
      document.querySelectorAll(".admin-q-reset").forEach(btn=>{
        btn.onclick = ()=>{
          const lv2 = Number(btn.dataset.lv), pool = btn.dataset.pool, idx = Number(btn.dataset.idx);
          delete questionOverrides[lv2+":"+pool+":"+idx];
          saveQuestionOverrides(questionOverrides);
          render(at("adminQuestionReset"));
        };
      });
    }
    render();
  }

  /* ---- 管理者ユーティリティ「🎵 BGMを楽しむ」(2026-08-24新規実装) ----
     ユーザー指定: 「管理画面にボタンを１つ追加して、「BGMを楽しむ」というボタンを作り、それを
     押すと、BGMのファイルの一覧が表示されファイル名の隣の再生ボタンを押すとそれぞれのBGMが
     再生される仕様にしてください」
     実際のゲーム進行中に使う<audio id="bgm">要素とは別に、試聴専用のnew Audio()を都度生成する。
     こうすることで、試聴中でも裏で進んでいるゲーム本体のBGM状態(現在のマップ・ループ設定等)を
     一切壊さずに済む。同時に鳴らせるのは1曲のみとし、別の曲の再生ボタンを押すか、この画面を
     閉じると、それまでの試聴は自動的に停止する。 */
  // ゲーム本編のBGM(<audio id="bgm">)を、現在のマップの曲で再度鳴らす。
  // switchBgmTrack()はsrcが変化しない場合は何もしない(=一時停止したままになる)ため、
  // 「試聴のために一時停止しただけでsrc自体は変わっていない」ケースも正しく再開できるよう、
  // src据え置きの場合は明示的にbgmEl.play()を呼ぶ。
  function resumeGameBgmForCurrentMap(){
    const path = bgmPathForMap(state.currentMap);
    if(bgmSourceEl.getAttribute("src") !== path){
      switchBgmTrack(path);
    } else if(bgmStarted && !bgmEl.muted && bgmEl.paused){
      bgmEl.play().catch(()=>{});
    }
  }
  function openAdminBgmPlayer(returnTo){
    let previewAudio = null;
    let previewFile = null;
    // この画面を開いている間は、ページ上の何気ないクリックでゲーム本編のBGMが
    // 不意に再開しないようにする(詳しくはsuppressGameBgmForPreviewの定義コメント参照)。
    // ゲーム本編のBGM自体はすでに一時停止済み、または後続のbgmEl.pause()で止める。
    suppressGameBgmForPreview = true;
    bgmEl.pause();
    activeModalRenderer = ()=> openAdminBgmPlayer(returnTo);
    function stopPreview(){
      if(previewAudio){ previewAudio.pause(); previewAudio.currentTime = 0; }
      previewAudio = null; previewFile = null;
    }
    function render(){
      const rows = BGM_LIBRARY.map(item=>{
        const playing = previewFile===item.file;
        const fileName = item.file.replace("public/audio/","");
        return `<div class="admin-bgm-row">
          <span class="admin-bgm-name">${item.label}<br><span class="admin-bgm-file">${fileName}</span></span>
          <button type="button" class="admin-bgm-play" data-file="${escapeAttr(item.file)}" aria-label="${playing?"pause":"play"}">${playing?"⏸️":"▶️"}</button>
        </div>`;
      }).join("");
      openModal(`
        <div class="card admin-wide-card">
          <div class="badge">🎵 ${at("adminBgmTitle")}</div>
          <p class="scramble-hint">${at("adminBgmHint")}</p>
          <div class="admin-bgm-list">${rows}</div>
          <button class="secondary" id="adminBgmBackBtn">${t("devClose")}</button>
        </div>
      `);
      document.querySelectorAll(".admin-bgm-play").forEach(btn=>{
        btn.onclick = ()=>{
          const file = btn.dataset.file;
          if(previewFile===file){ stopPreview(); render(); return; }
          stopPreview();
          // ユーザー指定(2026-08-24): 試聴を始めるときは、既に流れているゲーム本編のBGMを止めてから
          // 指定の曲を鳴らす(二重に音が重ならないようにする)。試聴が最後まで再生し終わっても
          // ループはせず、そのまま無音のままでよい(new Audio()はデフォルトでループしないため
          // 追加の対応は不要)。ゲーム本編のBGMの再開は、この画面を抜けるときにのみ行う。
          bgmEl.pause();
          previewAudio = new Audio(file);
          previewFile = file;
          previewAudio.play().catch(()=>{});
          previewAudio.addEventListener("ended", ()=>{
            if(previewFile===file){ stopPreview(); render(); }
          });
          render();
        };
      });
      document.getElementById("adminBgmBackBtn").onclick = ()=>{
        stopPreview();
        suppressGameBgmForPreview = false;
        resumeGameBgmForCurrentMap();
        openAdminUtilityMenu(returnTo);
      };
    }
    render();
  }
  function escapeAttr(s){
    return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // 管理者パネルからの直接マップ移動。goToMap2〜7と同じ処理を汎用化したもの
  // (ストーリーの導入フラバーテキストは表示しない、動作確認用の即時移動)。
  // ユーザー指定(2026-08-28): 管理者パネルからマップへ直接移動する際は、動作確認が
  // しやすいように体力10・ゴールド65535・薬草3個・武器防具類(道場修了フラグ+全アイテム)を
  // 装備した状態にしてから移動する。
  function adminJumpToMap(n){
    closeModal();
    state.currentMap = n;
    state.cellIdx = 0;
    state.busy = false;
    state.lastDiceRoll = null;
    state.life = 10;
    state.gold = 65535;
    state.herbCount = 3;
    state.hasOrderScroll = true;
    state.dojoCombatDone = true;
    state.dojoDefenseDone = true;
    state.dojoItemDone = true;
    state.hasElixir = true;
    state.hasAmulet = true;
    state.hasClimbingBoots = true;
    resetQuestionBags();
    state.cellMap = buildMapByNumber(n);
    renderStaticText();
    buildBoard();
    renderHUD();
    diceEl.classList.remove("disabled");
    hintEl.textContent = t("hintRoll");
    switchBgmTrack(bgmPathForMap(n));
    scheduleAutoSave();
  }

  /* =========================================================
     遊び方(ヘルプ)パネル
     - UIの表示言語(state.lang)に関わらず、常にベトナム語と日本語を
       併記する(ユーザー要望により、現在の表示言語設定とは独立)。
  ========================================================= */
  const HELP_ITEMS = [
    { vi:"Mục tiêu: Giải cứu công chúa bị rồng bắt cóc, theo lệnh của Quốc Vương.",
      ja:"目的: ドラゴンにさらわれた姫を、国王の依頼で助け出す。" },
    { vi:"Cách chơi: Nhấn (chạm) vào hình xúc xắc để tung xúc xắc và di chuyển quân cờ trên bàn cờ.",
      ja:"遊び方: サイコロの絵をタップ(クリック)するとサイコロが振られ、マスを進みます。" },
    { vi:"Khi gặp quái vật/người gác cổng, hãy trả lời đúng câu hỏi tiếng Nhật để chiến thắng. Trả lời sai sẽ mất Sinh lực (Life).",
      ja:"モンスターや番人に遭遇したら、日本語の問題に正しく答えて倒そう。間違えるとライフが減る。" },
    { vi:"3 võ đường trong thị trấn hoàng gia (Chiến đấu / Phòng thủ / Vật phẩm) cần tu luyện trước khi có thể tiến xa hơn trong thị trấn.",
      ja:"城下町にある3つの道場(戦い方・守り方・アイテムの使い方)は、先に進む前に修行しておく必要がある。" },
    { vi:"Sinh lực về 0 sẽ kết thúc trò chơi (trừ khi có Elixir). Kinh nghiệm (Exp) đầy 100 sẽ tăng thêm 1 Sinh lực tối đa.",
      ja:"ライフが0になるとゲームオーバー(エリクサー所持時を除く)。経験値(Exp)が100たまるとライフの上限が1増える。" },
    { vi:"Vàng (Gold) nhận được khi đánh bại quái vật, có thể dùng ở Cửa hàng để mua vật phẩm (cỏ thuốc, ủng, v.v).",
      ja:"モンスターを倒すとゴールドが手に入り、ショップで薬草・ブーツなどのアイテムと交換できる。" },
    { vi:"🎒 Vật phẩm đang mang theo hiển thị dưới thanh chỉ số (Sinh lực/KN/Vàng); di chuột (hoặc chạm) vào để xem giải thích.",
      ja:"🎒 現在持っているアイテムはライフ等のHUDの下に表示され、カーソルを合わせる(またはタップする)と説明が見られる。" },
    { vi:"💾 Có thể lưu tiến trình chơi thủ công bất cứ lúc nào (cần đăng nhập bằng email trước).",
      ja:"💾 いつでも手動でセーブできる(あらかじめメールでログインしておく必要がある)。" },
    { vi:"⚙ Có thể chuyển đổi ngôn ngữ hiển thị giữa Tiếng Việt và Tiếng Nhật.",
      ja:"⚙ 表示言語をベトナム語と日本語の間で切り替えられる。" },
  ];
  function openHelpPanel(){
    const returnTo = activeModalRenderer;
    const itemsHtml = HELP_ITEMS.map(it=>`
      <div class="help-item">
        <p class="help-vi">${it.vi}</p>
        <p class="help-ja">${it.ja}</p>
      </div>
    `).join("");
    openModal(`
      <div class="card">
        <div class="badge">？ Hướng dẫn chơi / 遊び方</div>
        ${itemsHtml}
        <button class="secondary" id="helpCloseBtn" style="margin-top:10px;">Đóng / 閉じる</button>
      </div>
    `);
    document.getElementById("helpCloseBtn").onclick = ()=>{
      if(returnTo){ returnTo(); } else { closeModal(); }
    };
  }
  document.getElementById("helpBtn").addEventListener("click", openHelpPanel);

  /* =========================================================
     初期化
  ========================================================= */
  function showIntro(){
    activeModalRenderer = showIntro;
    openModal(`
      <div class="card">
        <div class="badge">STORY</div>
        <div class="final-emoji">🧝 → 🏰 → 🐉 → 👸</div>
        <h2>${t("introTitle")}</h2>
        <p>${t("introText")}</p>
        <button class="primary" id="startBtn">${t("startBtn")}</button>
        <br><button class="secondary" id="introHelpBtn" style="margin-top:10px;">${t("introHelpBtn")}</button>
      </div>
    `);
    document.getElementById("startBtn").onclick = ()=>{
      switchBgmTrack(bgmPathForMap(1));
      closeModal();
    };
    document.getElementById("introHelpBtn").onclick = ()=>{ openHelpPanel(); };
  }

  function resetGame(){
    resetQuestionBags();
    state.currentMap = 1;
    state.cellIdx = 0;
    state.life = 5; state.maxLife = 25;
    state.exp = 0;
    state.gold = 0;
    state.heroName = "";
    state.hasOrderScroll = false;
    state.dojoCombatDone = false;
    state.dojoDefenseDone = false;
    state.dojoItemDone = false;
    state.hasElixir = false;
    state.herbCount = 0;
    state.hasAmulet = false;
    state.hasClimbingBoots = false;
    state.busy = false;
    state.lastDiceRoll = null;
    state.cellMap = buildMap1();
    renderStaticText();
    buildBoard();
    renderHUD();
    diceEl.classList.remove("disabled");
    hintEl.textContent = t("hintStart");
    closeModal();
  }

  diceEl.addEventListener("click", rollDice);
  diceEl.addEventListener("keydown", (e)=>{
    if(e.key==="Enter" || e.key===" "){ e.preventDefault(); rollDice(); }
  });
  // ユーザー指定(2026-08-24): サイコロの絵だけでなく、マップ(盤面)のどこをクリックしても
  // サイコロを振れるようにする。盤面のマスには元々クリックハンドラが付いていないため、
  // 単純にboard要素全体にクリックリスナーを追加するだけで安全に実現できる(rollDice()自体が
  // state.busy中は何もしないガードを持っているため、演出中の連打・誤操作でも問題ない)。
  boardEl.addEventListener("click", rollDice);

  function showContinuePrompt(savedState){
    function render(){
      activeModalRenderer = render;
      openModal(`
        <div class="card">
          <div class="final-emoji">💾</div>
          <h2>${t("continuePromptTitle")}</h2>
          <p>${t("continuePromptText")}</p>
          <button class="primary" id="continueYesBtn">${t("continueYesBtn")}</button>
          <br><button class="secondary" id="continueNoBtn" style="margin-top:10px;">${t("continueNoBtn")}</button>
        </div>
      `);
      document.getElementById("continueYesBtn").onclick = ()=>{
        applyStateSnapshot(savedState);
        switchBgmTrack(bgmPathForMap(state.currentMap));
        closeModal();
        showEvent(()=> showFlavor("🧝", t("welcomeBackText", heroDisplayName()||"..."), t("hintRoll"), ()=>{}));
      };
      document.getElementById("continueNoBtn").onclick = ()=>{
        resetGame();
        showIntro();
      };
    }
    render();
  }

  // 画像/音声の読み込み完了を待つ小さなヘルパー。
  // すでに読み込み済み(complete / readyState十分)なら即resolveする。
  // どちらも「失敗」時(onerror)も先へ進めるようresolveし、画面が固まらないようにする。
  function waitForImageReady(imgEl){
    return new Promise((resolve)=>{
      if(imgEl.complete){ resolve(); return; }
      imgEl.addEventListener("load", resolve, {once:true});
      imgEl.addEventListener("error", resolve, {once:true});
    });
  }
  function waitForAudioReady(audioEl){
    return new Promise((resolve)=>{
      // readyState >= 3 (HAVE_FUTURE_DATA) であれば再生を始めるのに十分
      if(audioEl.readyState >= 3){ resolve(); return; }
      audioEl.addEventListener("canplaythrough", resolve, {once:true});
      audioEl.addEventListener("error", resolve, {once:true});
    });
  }

  async function showOpeningScreen(onStart){
    const el = document.getElementById("openingScreen");
    const loadingEl = document.getElementById("openingLoading");
    const imgEl = document.getElementById("openingImg");
    const contentEl = document.getElementById("openingContent");

    // 画像とBGMの読み込みを待つ間、Loading...表示を出しておく。
    // 通信が遅い端末でいつまでも待たされないよう、最大8秒でタイムアウトして先へ進める。
    const assetsReady = Promise.all([waitForImageReady(imgEl), waitForAudioReady(bgmEl)]);
    const timeout = new Promise((resolve)=> setTimeout(resolve, 8000));
    await Promise.race([assetsReady, timeout]);

    loadingEl.classList.add("hidden");
    imgEl.classList.add("is-loaded");
    contentEl.classList.add("is-loaded");

    // ここでは曲の切り替えは行わない。オープニングBGMがすぐ次の曲に
    // 差し替えられて聞こえないまま終わってしまわないよう、マップBGMへの
    // 切り替えは実際に冒険を開始するタイミング(ストーリー紹介を閉じる時、
    // または「続きから」を選んだ時)まで遅らせる。
    const start = ()=>{
      el.style.display = "none";
      onStart();
    };
    el.addEventListener("click", start, {once:true});
    el.addEventListener("keydown", (e)=>{
      if(e.key==="Enter" || e.key===" "){ e.preventDefault(); start(); }
    }, {once:true});
  }

  async function init(){
    // まずローカルで新しいゲームを構築(ネットワーク不通/未ログイン時のフォールバック)
    resetGame();
    showOpeningScreen(async ()=>{
      let loggedIn = await handleMagicLinkRedirect();
      if(!loggedIn){ loggedIn = await restoreSessionFromLocal(); }
      updateAccountBtnState();
      if(loggedIn){
        const saved = await loadProgress();
        if(saved && saved.state && saved.state.heroName){
          showContinuePrompt(saved.state);
          return;
        }
      }
      showIntro();
    });
  }

  init();
})();
</script>
