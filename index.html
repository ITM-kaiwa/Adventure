<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勇者の日本語冒険 - LV1〜LV35 全世界制覇の旅</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b2a4a;
    --navy-light:#334872;
    --parchment:#f2e8d5;
    --parchment-dark:#e3d5b8;
    --gold:#d4a017;
    --gold-light:#f0c94a;
    --ink:#3a2a1e;
    --heart:#c94f6d;
    --accent:#3f6644;
    --accent-light:#5c8a5f;
    --bg1:#24365e; --bg2:#1b2a4a; --bg3:#0e1830;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--parchment);
    background:radial-gradient(ellipse at top, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    min-height:100vh;
    overflow-x:hidden;
    transition:background 1s ease;
  }
  body.world0{ --accent:#3f6644; --accent-light:#5c8a5f; --bg1:#24365e; --bg2:#1b2a4a; --bg3:#0e1830; }
  body.world1{ --accent:#1f5f7a; --accent-light:#3d92b5; --bg1:#123a52; --bg2:#0c2740; --bg3:#061420; }
  body.world2{ --accent:#8a3a1e; --accent-light:#c9642f; --bg1:#4a1e14; --bg2:#33130c; --bg3:#1a0805; }
  body.world3{ --accent:#a67a2e; --accent-light:#d1a94f; --bg1:#4a3a1e; --bg2:#332812; --bg3:#1a1408; }
  body.world4{ --accent:#2e5a2e; --accent-light:#4f8a4f; --bg1:#1e3a24; --bg2:#132814; --bg3:#0a1408; }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 90px 80px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 150px 40px, rgba(255,255,255,.6), transparent),
      radial-gradient(1.5px 1.5px at 210px 120px, rgba(255,255,255,.4), transparent),
      radial-gradient(1px 1px at 260px 20px, rgba(255,255,255,.5), transparent);
    background-repeat:repeat; background-size:300px 200px;
    opacity:.7;
  }
  .app{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:14px 14px 60px; }

  header.top{ text-align:center; padding:10px 0 6px; }
  header.top h1{
    font-family:'Noto Serif JP', serif;
    font-weight:900;
    font-size:clamp(1.25rem, 4.6vw, 1.8rem);
    margin:0 0 2px;
    letter-spacing:.03em;
    color:var(--gold-light);
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  header.top p{ margin:0; font-size:.78rem; color:#c9d3ea; }

  .worldbar{
    display:flex; align-items:center; justify-content:center; gap:6px;
    margin:8px 0 4px; flex-wrap:wrap;
  }
  .worldchip{
    font-size:.68rem; padding:4px 9px; border-radius:999px;
    border:1px solid rgba(212,160,23,.4); background:rgba(15,22,42,.5);
    color:#c9d3ea; white-space:nowrap;
  }
  .worldchip.done{ background:var(--accent); color:#fff; border-color:var(--accent-light); }
  .worldchip.current{ background:var(--gold); color:#2c1d10; font-weight:700; border-color:var(--gold-light); }

  .hud{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(15,22,42,.6);
    border:1px solid rgba(212,160,23,.35);
    border-radius:14px;
    padding:9px 13px;
    margin:10px 0;
    backdrop-filter:blur(4px);
    font-size:.82rem;
    flex-wrap:wrap;
  }
  .hud .hearts span{ font-size:1rem; margin-right:1px; filter:drop-shadow(0 0 3px rgba(201,79,109,.6)); }
  .hud .shields{ color:var(--gold-light); font-size:.9rem; white-space:nowrap; }
  .hud .equip{ color:#f0eaff; font-size:.85rem; white-space:nowrap; display:flex; gap:8px; }
  .hud .equip span{ white-space:nowrap; }
  .hud .progress{ text-align:right; color:#c9d3ea; }
  .hud .progress b{ color:var(--gold-light); }

  .board-wrap{
    background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, #223454) 0%, #223454 100%);
    border:2px solid rgba(212,160,23,.4);
    border-radius:18px;
    padding:14px;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
    margin-bottom:14px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:7px;
  }
  .tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:.58rem;
    line-height:1.1;
    text-align:center;
    padding:2px;
    border:1.5px solid rgba(0,0,0,.25);
    box-shadow:0 2px 0 rgba(0,0,0,.2) inset;
    transition:transform .2s ease;
    opacity:.55;
  }
  .tile.cleared{ opacity:.85; }
  .tile.icon-big .icon{ font-size:1.1rem; }
  .tile .num{ position:absolute; top:2px; left:3px; font-size:.5rem; opacity:.6; font-weight:700;}
  .tile.current{ opacity:1; transform:scale(1.1); box-shadow:0 0 0 3px var(--gold-light), 0 4px 10px rgba(0,0,0,.4); z-index:2; }

  .tile.quiz{ background:var(--accent); color:#eaf3ea; }
  .tile.bonus{ background:var(--gold); color:#3a2a1e; }
  .tile.trap{ background:#8b2635; color:#fbe6e6; }
  .tile.heart{ background:var(--heart); color:#fff0f2; }
  .tile.story{ background:#4a4470; color:#ece8fb; }
  .tile.item{ background:#5a4a8a; color:#f0eaff; }
  .tile.elixir{ background:linear-gradient(160deg,#b8860b,#8a5a00); color:#fff8e1; border-color:var(--gold-light); }
  .tile.midboss{ background:#7a1f1f; color:#ffe6e6; border-color:var(--gold); }
  .tile.guardian{ background:linear-gradient(160deg,#3a2a1e,#1b1210); color:var(--gold-light); font-weight:700; border:2px solid var(--gold); }
  .tile.start{ background:var(--parchment); color:var(--ink); font-weight:700; }
  .tile.goal{ background:linear-gradient(160deg,#3a2a1e,#1b1210); color:var(--gold-light); font-weight:700; border:2px solid var(--gold); }

  .token{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; pointer-events:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
    animation:bob 1.4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

  .controls{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:rgba(15,22,42,.6);
    border:1px solid rgba(212,160,23,.35);
    border-radius:14px;
    padding:16px;
  }
  button.primary{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:1rem;
    padding:12px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:#2c1d10;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    box-shadow:0 4px 0 #a67a10, 0 8px 18px rgba(0,0,0,.35);
    transition:transform .08s ease;
  }
  button.primary:active{ transform:translateY(3px); box-shadow:0 1px 0 #a67a10; }
  button.primary:disabled{ opacity:.5; cursor:not-allowed; filter:grayscale(.3); }
  .hint{ font-size:.78rem; color:#c9d3ea; text-align:center; min-height:1.2em; }

  .overlay{
    position:fixed; inset:0; background:rgba(10,14,26,.75);
    display:flex; align-items:center; justify-content:center;
    padding:18px; z-index:50;
    animation:fadein .2s ease;
  }
  @keyframes fadein{ from{opacity:0} to{opacity:1} }
  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:18px;
    max-width:480px; width:100%;
    padding:24px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    border:3px solid var(--gold);
    text-align:center;
    max-height:88vh; overflow-y:auto;
  }
  .card h2{ font-family:'Noto Serif JP', serif; font-size:1.2rem; margin:0 0 10px; }
  .card p{ font-size:.9rem; line-height:1.7; margin:0 0 12px; }
  .badge{
    display:inline-block; font-size:.68rem; font-weight:700;
    background:var(--accent); color:#fff; padding:3px 10px; border-radius:999px;
    margin-bottom:10px; letter-spacing:.05em;
  }
  .badge.boss{ background:#8b2635; }
  .lesson-tag{ font-size:.7rem; color:#7a6a5a; margin-bottom:2px; }
  .qtext{ font-family:'Noto Serif JP', serif; font-size:1.08rem; font-weight:700; margin:6px 0 16px; line-height:1.6; }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:6px; }
  .choice-btn{
    font-family:'Noto Sans JP', sans-serif;
    font-size:.92rem;
    padding:12px 6px;
    border-radius:12px;
    border:2px solid var(--accent);
    background:#fff;
    cursor:pointer;
    transition:transform .1s ease, background .15s ease;
  }
  .choice-btn:hover:not(:disabled){ transform:translateY(-2px); background:#eef6ee; }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .choice-btn.wrong{ background:#8b2635; color:#fff; border-color:#8b2635; }

  .feedback{ font-size:.88rem; margin-top:10px; min-height:1.4em; font-weight:700; }
  .feedback.ok{ color:var(--accent); }
  .feedback.no{ color:#8b2635; }
  .feedback.shield{ color:#5a4a8a; }

  .final-emoji{ font-size:2.8rem; margin-bottom:8px; }
  .stat-row{ display:flex; justify-content:center; gap:20px; margin:14px 0; flex-wrap:wrap; }
  .stat{ text-align:center; }
  .stat b{ display:block; font-size:1.2rem; color:var(--accent); font-family:'Noto Serif JP',serif; }
  .stat span{ font-size:.7rem; color:#6a5a4a; }

  .bosslife{ display:flex; justify-content:center; gap:5px; margin:10px 0 16px; flex-wrap:wrap; }
  .bosslife span{ font-size:1.3rem; filter:drop-shadow(0 0 3px rgba(139,38,53,.5)); }

  ruby rt{ font-size:.6em; color:#9aa6c4; }
  .card ruby rt{ color:#8a7a6a; }

  @media (max-width:420px){
    .tile{ font-size:.5rem; }
    .tile .icon{ font-size:.95rem; }
  }
</style>
</head>
<body class="world0">
<div class="stars"></div>
<div class="app">

  <header class="top">
    <h1>⚔️ <ruby>勇者<rt>ゆうしゃ</rt></ruby>の<ruby>日本語<rt>にほんご</rt></ruby><ruby>冒険<rt>ぼうけん</rt></ruby> 🐉</h1>
    <p>みんなの日本語 初級 LV1〜LV35 総復習の旅</p>
  </header>

  <div class="worldbar" id="worldBar"></div>

  <div class="hud">
    <div class="hearts" id="heartsDisplay"></div>
    <div class="shields" id="shieldsDisplay"></div>
    <div class="equip" id="equipDisplay"></div>
    <div class="progress" id="progressLabel">草原の世界 / LV1</div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="controls">
    <button class="primary" id="advanceBtn">🚶 すすむ</button>
    <div class="hint" id="hint">「はじめる」を押して冒険に出発しよう</div>
  </div>

</div>

<div id="modalRoot"></div>

<script>
(function(){
  "use strict";

  /* =========================================================
     ワールド定義
  ========================================================= */
  const WORLDS = [
    { key:"grass", name:"草原の世界", icon:"🌿", lvRange:[1,7],
      guardianName:"草原の番人", guardianTitle:"グラスウォリアー", guardianIcon:"🦁" },
    { key:"water", name:"水の世界", icon:"🌊", lvRange:[8,14],
      guardianName:"水の番人", guardianTitle:"アクアサーペント", guardianIcon:"🐍" },
    { key:"fire", name:"炎の世界", icon:"🔥", lvRange:[15,21],
      guardianName:"炎の番人", guardianTitle:"フレイムナイト", guardianIcon:"🔥" },
    { key:"desert", name:"砂漠の世界", icon:"🏜️", lvRange:[22,28],
      guardianName:"砂漠の番人", guardianTitle:"サンドタイタン", guardianIcon:"🦂" },
    { key:"forest", name:"樹木の世界", icon:"🌳", lvRange:[29,35],
      guardianName:"樹木の番人", guardianTitle:"エンシェントツリー", guardianIcon:"🌳" },
  ];

  const MIDBOSS = {
    14:{ name:"ウォーターゴーレム", icon:"💧👹" },
    17:{ name:"サラマンダー", icon:"🦎🔥" },
    18:{ name:"イフリート", icon:"👹🔥" },
    22:{ name:"スコーピオンキング", icon:"🦂👑" },
    27:{ name:"サンドリーパー", icon:"🏜️💀", reward:"sword" },
    31:{ name:"ダークエント", icon:"🌳👹", reward:"shield" },
    33:{ name:"もりのせいれい", icon:"🌲✨", reward:"armor" },
  };

  // 中ボス撃破報酬の説明テキスト
  const REWARD_INFO = {
    sword:{ icon:"⚔️", title:"勇者の剣を手に入れた！",
      text:"剣の力が宿った！これからは正解のたびに敵に与えるダメージが2倍になる（1問正解で敵のライフが2減る）。" },
    shield:{ icon:"🛡️", title:"勇者の盾を手に入れた！",
      text:"盾を装備した！攻撃を2回まで防いでくれる。3回目のダメージを受けると盾は壊れてしまう。" },
    armor:{ icon:"🥋", title:"勇者の鎧を手に入れた！",
      text:"鎧を身にまとった！攻撃を3回まで防いでくれる。4回目のダメージを受けると鎧は壊れてしまう。" },
  };

  /* =========================================================
     35レベル分の問題データ（各レベル：normal x3, hard x2）
  ========================================================= */
  const LEVELS = [
  {lv:1, lesson:"だい1か", title:"これ／それ／あれ・です", normal:[
    {q:"「これは ほんです。」の「これ」が指すのは？", c:["話し手に近いもの","聞き手に近いもの","両方から遠いもの","場所"], a:0},
    {q:"「わたし＿がくせいです。」＿に入る助詞は？", c:["は","を","に","へ"], a:0},
    {q:"「はじめまして」の意味は？", c:["Goodbye","Nice to meet you","Thank you","Excuse me"], a:1}],
    hard:[
    {q:"「あれは たなかさんの かさですか。」の「あれ」が正しく使えるのは？", c:["話し手に近い物","聞き手に近い物","両方から遠い物","質問する時だけ"], a:2},
    {q:"A「これは何ですか」B「それは とけいです。」Bにとって「それ」の位置は？", c:["Bに近い","Aに近い","二人から遠い","分からない"], a:1}]},

  {lv:2, lesson:"だい2か", title:"この／その／あの＋名詞・の(所有)", normal:[
    {q:"「この ほんは わたしのです。」の「この」の後には何が来る？", c:["動詞","名詞","形容詞","助詞のみ"], a:1},
    {q:"「たなかさんの かさ」の「の」の働きは？", c:["場所","所有","時間","方向"], a:1},
    {q:"「そこ」が指すのは？", c:["自分の近く","相手の近く","両方から遠い","疑問"], a:1}],
    hard:[
    {q:"「あの ひとは だれの せんせいですか。」の「あの」が正しいのは？", c:["話し手の近くの人","聞き手の近くの人","二人から離れた人","架空の人物"], a:2},
    {q:"「これは わたしの かばんで、それは やまださんのです。」後半「それ」が省略している名詞は？", c:["ほん","かさ","かばん","くつ"], a:2}]},

  {lv:3, lesson:"だい3か", title:"あります／います", normal:[
    {q:"人や動物がいることを言う時に使う動詞は？", c:["あります","います","します","たべます"], a:1},
    {q:"「つくえの うえに ほんが＿。」＿に入るのは？", c:["います","あります","いります","わかります"], a:1},
    {q:"「にわに ねこが＿。」＿に入るのは？", c:["あります","います","します","みます"], a:1}],
    hard:[
    {q:"「きょうしつに がくせいが 5にん＿。」正しい動詞は？", c:["あります","います","します","みます"], a:1},
    {q:"物と人で動詞を使い分ける理由として正しいのは？", c:["生き物には「います」を使う文法規則があるから","意味は同じでどちらでもいいから","地域差があるだけ","古い言い方だから"], a:0}]},

  {lv:4, lesson:"だい4か", title:"数字・時間表現", normal:[
    {q:"「いま なんじですか」の答えとして正しい形は？", c:["3じです","3にちです","3かいです","3ばんです"], a:0},
    {q:"「9じから 5じまで」の「から」の意味は？", c:["終わり","始まり","方向","場所"], a:1},
    {q:"「はん」の意味は？", c:["半分(30分)","1時間","午前","午後"], a:0}],
    hard:[
    {q:"「ぎんこうは 9じはんから 3じまでです。」営業時間として正しいのは？", c:["9:30〜15:00","9:00〜15:30","15:00〜9:30","終日営業"], a:0},
    {q:"「なんじに おきますか」の「に」の役割は？", c:["場所を表す","時間の一点を表す","方向を表す","手段を表す"], a:1}]},

  {lv:5, lesson:"だい5か", title:"動詞ます形(行く・来る・帰る)・へ", normal:[
    {q:"「がっこう＿いきます。」＿に入る助詞は？", c:["へ","を","で","と"], a:0},
    {q:"「らいねん にほんへ いきます。」の「らいねん」の意味は？", c:["来年","去年","今年","来月"], a:0},
    {q:"「なにで がっこうへ いきますか」の「で」が表すのは？", c:["場所","手段(交通手段)","時間","相手"], a:1}],
    hard:[
    {q:"「せんしゅう くにへ かえりました。」の時制は？", c:["未来","現在","過去","習慣"], a:2},
    {q:"徒歩で行くことを言う自然な表現は？", c:["あるきます","あるいてで","あるいて","あるくで"], a:2}]},

  {lv:6, lesson:"だい6か", title:"動詞ます形(する・たべる等)・を", normal:[
    {q:"「ばんごはんを＿。」に入る自然な動詞は？", c:["たべます","いきます","あります","います"], a:0},
    {q:"「なにを しますか」の「を」の役割は？", c:["対象(目的語)を表す","場所を表す","時間を表す","方向を表す"], a:0},
    {q:"「でんわを かけます」の意味は？", c:["電話を切る","電話をかける","電話を待つ","電話を売る"], a:1}],
    hard:[
    {q:"「まいあさ しんぶんを よみます。」の「まいあさ」の意味に近いのは？", c:["毎晩","毎朝","毎週","毎年"], a:1},
    {q:"目的語(を)を伴うのに不自然な文はどれ？", c:["ほんを よみます","ごはんを たべます","を たべます(動詞なし)","しんぶんを よみます"], a:2}]},

  {lv:7, lesson:"だい7か", title:"あげます／もらいます・〜がほしいです", normal:[
    {q:"「わたしは たなかさんに はなを あげました。」花を渡したのは誰？", c:["たなかさん","わたし","第三者","不明"], a:1},
    {q:"「もらいます」の反対の意味に近いのは？", c:["あげます","かいます","うります","たべます"], a:0},
    {q:"「あたらしい かばんが ほしいです。」の意味は？", c:["新しいかばんを持っている","新しいかばんが欲しい","新しいかばんを捨てた","新しいかばんを売った"], a:1}],
    hard:[
    {q:"「わたしは たなかさんに ほんを もらいました。」本を渡したのは誰？", c:["わたし","たなかさん","わからない","二人とも"], a:1},
    {q:"「あげます」と「もらいます」の使い分けで正しいのは？", c:["あげますは受け取る側,もらいますは渡す側","あげますは渡す側,もらいますは受け取る側","どちらも同じ意味","文法的に誤り"], a:1}]},

  {lv:8, lesson:"だい8か", title:"い形容詞・な形容詞", normal:[
    {q:"「あたらしい」はどちらの形容詞？", c:["い形容詞","な形容詞","動詞","名詞"], a:0},
    {q:"「しずかな へや」の「しずかな」は？", c:["い形容詞","な形容詞","動詞","副詞"], a:1},

  function buildWorldTiles(worldIdx){
    const [start, end] = WORLDS[worldIdx].lvRange;
    const bank = WORLD_FILLERS[worldIdx];
    const tiles = [];
    tiles.push({t:"story", ...WORLD_INTRO[worldIdx]});
    let fi = 0;
    const FILLERS_PER_LEVEL = 3;
    for(let lv=start; lv<=end; lv++){
      tiles.push({t:"lv", lv});
      for(let k=0;k<FILLERS_PER_LEVEL;k++){
        tiles.push({...bank[fi % bank.length]});
        fi++;
      }
    }
    tiles.push({t:"guardian"});
    // 砂漠の世界だけ「エリクサー」を1つ追加し、オアシスの水を見つけた直後に配置する
    if(worldIdx===3){
      const oasisIdx = tiles.findIndex(t=>t.label==="オアシスの水");
      if(oasisIdx>=0){
        tiles.splice(oasisIdx+1, 0, {t:"elixir", icon:"🧪", label:"エリクサー", text:"オアシスの奥で光る秘薬「エリクサー」を見つけた！力尽きた時、一度だけ体力3で復活できる。"});
      }
    }
    return tiles;
  }

      if(i < state.worldIdx) cls += " done";
      else if(i === state.worldIdx) cls += " current";
      return `<span class="${cls}">${w.icon} ${w.name}</span>`;

  }

  /* =========================================================

  ========================================================= */
  const boardEl = document.getElementById("board");
  const COLS = 6;

  function tileVisual(tileObj){
    switch(tileObj.t){
      case "story": return {cls:"story", icon:tileObj.icon, label:tileObj.label};
      case "lv": {
        const lvData = LEVEL_BY_LV[tileObj.lv];
        const isMid = !!MIDBOSS[tileObj.lv];
        return {cls: isMid? "midboss":"quiz", icon: isMid? MIDBOSS[tileObj.lv].icon : "📖", label:"LV"+tileObj.lv};
      }
      case "heart": return {cls:"heart", icon:tileObj.icon, label:tileObj.label};
      case "item": return {cls:"item", icon:tileObj.icon, label:tileObj.label};
      case "elixir": return {cls:"elixir", icon:tileObj.icon, label:tileObj.label};
      case "bonus": return {cls:"bonus", icon:tileObj.icon, label:tileObj.label};
      case "trap": return {cls:"trap", icon:tileObj.icon, label:tileObj.label};
      case "guardian": {
        const w = WORLDS[state.worldIdx];
        return {cls:"guardian", icon:w.guardianIcon, label:"番人"};
      }
      default: return {cls:"quiz", icon:"❓", label:""};
    }
  }

  function buildBoard(){
    boardEl.innerHTML = "";
    state.tiles.forEach((tileObj, i)=>{
      const row = Math.floor(i/COLS);
      const posInRow = i % COLS;
      const col = (row % 2 === 0) ? posInRow : (COLS-1-posInRow);
      const totalRows = Math.ceil(state.tiles.length/COLS);
      const gridRow = totalRows - row;

      const v = tileVisual(tileObj);
      const div = document.createElement("div");
      div.className = "tile icon-big " + v.cls;
      div.style.gridColumn = (col+1);
      div.style.gridRow = gridRow;
      div.id = "tile-"+i;
      div.innerHTML = `<span class="num">${i}</span><span class="icon">${v.icon}</span><span>${v.label}</span>`;
      boardEl.appendChild(div);
    });
    placeToken();
  }

  function placeToken(){
    document.querySelectorAll(".tile").forEach(t=>{
      t.classList.remove("current");
      const tok = t.querySelector(".token");
      if(tok) tok.remove();
    });
    for(let i=0;i<state.tileIdx;i++){
      const t = document.getElementById("tile-"+i);
      if(t) t.classList.add("cleared");
    }
    const cur = document.getElementById("tile-"+state.tileIdx);
    if(!cur) return;
    cur.classList.add("current");
    const tok = document.createElement("div");
    tok.className = "token";
    tok.textContent = "🧝";
    cur.appendChild(tok);
    cur.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
  }

  /* =========================================================
     ダメージ処理: お守り(消費型) → 盾(耐久2) → 鎧(耐久3) → 体力
  ========================================================= */
  function applyDamage(){
    if(state.shields>0){
      state.shields--;
      renderShields();
      return {type:"amulet", msg:"🛡️ お守りが身を守った！体力は減らない。"};
    }
    if(state.shieldUses>0){
      state.shieldUses--;
      renderEquipment();
      const broke = state.shieldUses<=0;
      return {type:"shield", msg: broke ? "🛡️ 盾が攻撃を防いだ！…が、力尽きて盾は壊れてしまった。" : "🛡️ 盾が攻撃を防いだ！(のこり"+state.shieldUses+"回)"};
    }
    if(state.armorUses>0){
      state.armorUses--;
      renderEquipment();
      const broke = state.armorUses<=0;
      return {type:"armor", msg: broke ? "🥋 鎧が攻撃を防いだ！…が、鎧は壊れてしまった。" : "🥋 鎧が攻撃を防いだ！(のこり"+state.armorUses+"回)"};
    }
    state.hearts = Math.max(0, state.hearts-1);
    renderHearts();
    return {type:"heart", msg:"❌ 残念…体力が減った。"};
  }

  // 体力が0になっていないか確認。0ならエリクサーで復活、なければゲームオーバー。
  // 体力が残っていれば afterContinue() をすぐ呼ぶ。
  function handleDefeatCheck(afterContinue){
    if(state.hearts>0){ afterContinue(); return; }
    if(state.elixirReady){
      state.elixirReady = false;
      state.hearts = 3;
      renderHearts();
      renderEquipment();
      showFlavor("🧪✨", "エリクサーの力！", "たおれかけたその瞬間、エリクサーの力で体力が3回復した！戦いを続けよう。", afterContinue);
    } else {
      showGameOver();
    }
  }

      <div class="card">
        <div class="badge">📖 もんだい</div>
        <div class="lesson-tag">${lessonLabel||""}</div>
        <div class="qtext">${question.q}</div>
        <div class="choices" id="choicesWrap">
          ${question.c.map((c,i)=>`<button class="choice-btn" data-i="${i}"><span>${c}</span></button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    `);
    const wrap = document.getElementById("choicesWrap");
    const fb = document.getElementById("fb");
    wrap.querySelectorAll(".choice-btn").forEach(btn=>{
      btn.onclick = ()=>{
        wrap.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true);
        const i = Number(btn.dataset.i);
        state.answered++;
        const isCorrect = (i===question.a);
        if(isCorrect){
          btn.classList.add("correct");
          fb.textContent = "✅ 正解！";
          fb.className = "feedback ok";
          state.correct++;
          setTimeout(()=>{ closeModal(); onDone(true); }, 850);
        } else {
          btn.classList.add("wrong");
          wrap.children[question.a].classList.add("correct");
          const res = applyDamage();
          fb.textContent = res.msg;
          fb.className = res.type==="heart" ? "feedback no" : "feedback shield";
          setTimeout(()=>{ closeModal(); onDone(false); }, 1000);
        }
      };
    });
  }

  function showFlavor(icon, title, text, onDone){
    openModal(`
      <div class="card">
        <div class="final-emoji">${icon}</div>
        <h2>${title}</h2>
        <p>${text}</p>
        <button class="primary" id="okBtn">つづける</button>
      </div>
    `);
    document.getElementById("okBtn").onclick = ()=>{ closeModal(); onDone(); };
  }

  function showBossIntro(boss, onDone){
    openModal(`
      <div class="card">
        <div class="badge boss">⚔️ BOSS BATTLE</div>
        <div class="final-emoji">${boss.icon}</div>
        <h2>${boss.name}が あらわれた！</h2>
        <p>${boss.flavor||""}</p>
        <div class="bosslife">${"❤️".repeat(boss.life)}</div>
        <button class="primary" id="fightBtn">戦う！</button>
      </div>
    `);
    document.getElementById("fightBtn").onclick = ()=>{ closeModal(); onDone(); };
  }

  function showGameOver(){
    openModal(`
      <div class="card">
        <div class="final-emoji">💔</div>
        <h2>力尽きてしまった…</h2>
        <p>体力がなくなってしまった。もう一度、村から挑戦しよう！</p>
        <div class="stat-row">
          <div class="stat"><b>${state.correct}</b><span>せいかい</span></div>
          <div class="stat"><b>${state.answered}</b><span>かいとう</span></div>
        </div>
        <button class="primary" id="retryBtn">🔁 もう一度挑戦する</button>
      </div>
    `);
    document.getElementById("retryBtn").onclick = resetGame;
  }

  function showWorldClear(world, onDone){
    openModal(`
      <div class="card">
        <div class="final-emoji">🏆</div>
        <h2>${world.guardianName}を倒した！</h2>
        <p>${world.name}を制覇した！体力が全回復した。次の世界へ進もう。</p>
        <button class="primary" id="nextBtn">次の世界へ</button>
      </div>
    `);
    document.getElementById("nextBtn").onclick = ()=>{ closeModal(); onDone(); };
  }

  function showVictory(){
    const acc = state.answered ? Math.round((state.correct/state.answered)*100) : 0;
    openModal(`
      <div class="card">
        <div class="badge">THE END</div>
        <div class="final-emoji">🧝⚔️🐉→👸✨</div>
        <h2>竜王を倒し、姫を救い出した！</h2>
        <p>五つの世界を制覇した勇者は、ついに竜王の城で姫を救い出した。<br>あなたの日本語の力が、二人を結びつけた。</p>
        <div class="stat-row">
          <div class="stat"><b>${state.correct}</b><span>せいかい</span></div>
          <div class="stat"><b>${state.answered}</b><span>かいとう</span></div>
          <div class="stat"><b>${acc}%</b><span>せいかいりつ</span></div>
        </div>
        <button class="primary" id="playAgainBtn">🔁 もう一度遊ぶ</button>
      </div>
    `);
    document.getElementById("playAgainBtn").onclick = resetGame;
  }

  /* =========================================================
     問題プール(通常・ハード)ユーティリティ
  ========================================================= */
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function makeCyclingPool(items){
    let pool = shuffle(items);
    let idx = 0;
    return function next(){
      if(idx >= pool.length){ pool = shuffle(items); idx = 0; }
      return pool[idx++];
    };
  }

  /* =========================================================
     ボス戦フレームワーク(番人・中ボス・ラスボス共通)
  ========================================================= */
  function runBossBattle(boss, onWin){
    const nextQ = makeCyclingPool(boss.pool);
    let life = boss.life;

    function ask(){
      const q = nextQ();
      const swordNote = state.hasSword ? "　⚔️剣の力でダメージ2倍" : "";
      showQuiz(q, boss.name+" との戦い (のこりライフ "+life+")"+swordNote, (correct)=>{
        handleDefeatCheck(()=>{
          if(correct){
            life -= state.hasSword ? 2 : 1;
            if(life<=0){
              onWin();
              return;
            }
          }
          setTimeout(ask, 150);
        });
      });
    }
    ask();
  }

  /* =========================================================
     移動・進行ロジック
  ========================================================= */
  const advanceBtn = document.getElementById("advanceBtn");
  const hintEl = document.getElementById("hint");

  function setBusy(b){ state.busy = b; advanceBtn.disabled = b; }

  function stepForward(n, cb){
    let remaining = n;
    const timer = setInterval(()=>{
      if(remaining<=0 || state.tileIdx >= state.tiles.length-1){
        clearInterval(timer);
        placeToken();
        renderProgress();
        cb();
        return;
      }
      state.tileIdx++;
      remaining--;
      placeToken();
      renderProgress();
    }, 220);
  }
  function stepBackward(n, cb){
    let remaining = n;
    const timer = setInterval(()=>{
      if(remaining<=0 || state.tileIdx<=0){
        clearInterval(timer);
        placeToken();
        renderProgress();
        cb();
        return;
      }
      state.tileIdx--;
      remaining--;
      placeToken();
      renderProgress();
    }, 220);
  }

  function endTurn(){
    setBusy(false);
    hintEl.textContent = "「すすむ」を押して先へ進もう";
  }

  function goNextWorld(){
    if(state.worldIdx >= WORLDS.length-1){
      // すべての世界を制覇 -> 最終ゴールへ
      state.inFinalBoss = true;
      renderWorldBar();
      renderProgress();
      triggerFinalBoss();
      return;
    }
    state.worldIdx++;
    state.tileIdx = 0;
    state.tiles = buildWorldTiles(state.worldIdx);
    document.body.className = "world"+state.worldIdx;
    renderWorldBar();
    buildBoard();
    renderProgress();
    endTurn();
  }

  function triggerFinalBoss(){
    setBusy(true);
    hintEl.textContent = "";
    const allHard = [];
    LEVELS.forEach(l=> allHard.push(...l.hard));
    const boss = {
      name:"竜王",
      icon: FINAL_ICON,
      life:30,
      flavor:"五つの世界を制覇した勇者の前に、姫をさらった竜王が姿を現した。これが最後の戦いだ！",
      pool: allHard,
    };
    showBossIntro(boss, ()=>{
      runBossBattle(boss, ()=>{
        showVictory();
      });
    });
  }

  function resolveTile(){
    const tileObj = state.tiles[state.tileIdx];

    if(tileObj.t === "story"){
      showFlavor(tileObj.icon, tileObj.label, tileObj.text, endTurn);
      return;
    }
    if(tileObj.t === "heart"){
      state.hearts = Math.min(state.maxHearts, state.hearts+1);
      renderHearts();
      showFlavor(tileObj.icon, tileObj.label, tileObj.text, endTurn);
      return;
    }
    if(tileObj.t === "item"){
      state.shields++;
      renderShields();
      showFlavor(tileObj.icon, tileObj.label, tileObj.text, endTurn);
      return;
    }
    if(tileObj.t === "elixir"){
      state.elixirReady = true;
      renderEquipment();
      showFlavor(tileObj.icon, tileObj.label, tileObj.text, endTurn);
      return;
    }
    if(tileObj.t === "bonus"){
      showFlavor(tileObj.icon, tileObj.label, tileObj.text, ()=>{
        stepForward(2, ()=>{ resolveTile(); });
      });
      return;
    }
    if(tileObj.t === "trap"){
      showFlavor(tileObj.icon, tileObj.label, tileObj.text, ()=>{
        stepBackward(2, endTurn);
      });
      return;
    }
    if(tileObj.t === "lv"){
      const lvData = LEVEL_BY_LV[tileObj.lv];
      const isMid = !!MIDBOSS[tileObj.lv];
      if(isMid){
        const mb = MIDBOSS[tileObj.lv];
        const boss = {
          name: mb.name,
          icon: mb.icon,
          life: 5,
          flavor: lvData.lesson+"「"+lvData.title+"」の力を試す中ボスが現れた！",
          pool: shuffle([...lvData.normal, ...lvData.hard]),
        };
        setBusy(true);
        showBossIntro(boss, ()=>{
          runBossBattle(boss, ()=>{
            if(mb.reward && REWARD_INFO[mb.reward]){
              const r = REWARD_INFO[mb.reward];
              if(mb.reward==="sword"){ state.hasSword = true; }
              else if(mb.reward==="shield"){ state.shieldUses = 2; state.shieldMax = 2; }
              else if(mb.reward==="armor"){ state.armorUses = 3; state.armorMax = 3; }
              renderEquipment();
              showFlavor(r.icon, r.title, mb.name+"を倒した！"+r.text, endTurn);
            } else {
              showFlavor("🏆", mb.name+"を倒した！", "中ボスとの戦いに勝利した！先へ進もう。", endTurn);
            }
          });
        });
        return;
      } else {
        const pool = shuffle(lvData.normal);
        const q = pool[0];
        showQuiz(q, lvData.lesson+" 「"+lvData.title+"」", (correct)=>{
          handleDefeatCheck(endTurn);
        });
        return;
      }
    }
    if(tileObj.t === "guardian"){
      const w = WORLDS[state.worldIdx];
      const pool = [];
      const [s,e] = w.lvRange;
      for(let lv=s; lv<=e; lv++){ pool.push(...LEVEL_BY_LV[lv].hard); }
      const boss = {
        name: w.guardianName+"「"+w.guardianTitle+"」",
        icon: w.guardianIcon,
        life: 3,
        flavor: w.name+"の最深部で番人が待ち構えている。3つの難問を突破せよ！",
        pool: shuffle(pool),
      };
      setBusy(true);
      showBossIntro(boss, ()=>{
        runBossBattle(boss, ()=>{
          state.hearts = state.maxHearts;
          renderHearts();
          showWorldClear(w, goNextWorld);
        });
      });
      return;
    }
    // fallback
    endTurn();
  }

  function onAdvance(){
    if(state.busy) return;
    if(state.tileIdx >= state.tiles.length-1){
      // 既にワールド最後のマス(番人)にいる場合はそのまま解決
      setBusy(true);
      resolveTile();
      return;
    }
    setBusy(true);
    hintEl.textContent = "";
    stepForward(1, ()=>{ resolveTile(); });
  }

  /* =========================================================
     初期化
  ========================================================= */
  function resetGame(){
    state.worldIdx = 0;
    state.tileIdx = 0;
    state.hearts = 5;
    state.maxHearts = 5;
    state.shields = 0;
    state.hasSword = false;
    state.shieldUses = 0;
    state.shieldMax = 0;
    state.armorUses = 0;
    state.armorMax = 0;
    state.elixirReady = false;
    state.correct = 0;
    state.answered = 0;
    state.busy = false;
    state.inFinalBoss = false;
    state.tiles = buildWorldTiles(0);
    document.body.className = "world0";
    renderWorldBar();
    buildBoard();
    renderHearts();
    renderShields();
    renderEquipment();
    renderProgress();
    advanceBtn.disabled = false;
    hintEl.textContent = "「すすむ」を押して先へ進もう";
    closeModal();
  }

  advanceBtn.addEventListener("click", onAdvance);

  resetGame();
  showIntro();
})();
</script>
</body>
</html>
