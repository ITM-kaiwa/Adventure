<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuộc Phiêu Lưu Của Dũng Sĩ - Bản đồ 1: Thị Trấn Hoàng Gia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b2a4a; --navy-light:#334872;
    --parchment:#f2e8d5; --parchment-dark:#e3d5b8;
    --gold:#d4a017; --gold-light:#f0c94a;
    --ink:#3a2a1e; --heart:#c94f6d;
    --accent:#7a5a2e; --accent-light:#b4934f;
    --bg1:#3a2f1e; --bg2:#241c10; --bg3:#100b06;
  }
  /* マップ2「草原」のテーマカラー(薄緑基調)。currentMapが2の間、bodyに
     .map2 クラスを付与してCSS変数を上書きする(タイル等の見た目はそのまま
     --gold/--parchment等の変数を参照しているだけで自動的に緑系に変わる)。 */
  body.map2{
    --gold:#6fae4a; --gold-light:#9cd478;
    --accent:#4f7a34; --accent-light:#8fbf68;
    --bg1:#5c7f3c; --bg2:#33501f; --bg3:#111d0a;
  }
  /* マップ3「洞窟」のテーマカラー(暗い青灰色基調)。松明のような琥珀色を差し色に使う。 */
  body.map3{
    --gold:#c98a3e; --gold-light:#e6ac5c;
    --accent:#5a6270; --accent-light:#8b93a0;
    --bg1:#2a2d33; --bg2:#16181c; --bg3:#050607;
  }
  /* マップ4「水のエリア」のテーマカラー(透明感あふれる水色基調)。 */
  body.map4{
    --gold:#4fc3e0; --gold-light:#8fe8f5;
    --accent:#2f8fae; --accent-light:#7cc9e0;
    --bg1:#1f5f78; --bg2:#123244; --bg3:#05131c;
  }
  /* マップ5「炎のエリア」のテーマカラー(真紅の炎基調)。 */
  body.map5{
    --gold:#d43a2f; --gold-light:#f2694a;
    --accent:#8c1f1f; --accent-light:#c94f3a;
    --bg1:#5c1010; --bg2:#300808; --bg3:#120202;
  }
  /* マップ6「高山(雪山)」のテーマカラー(白〜青白い雪のグラデーション基調)。 */
  body.map6{
    --gold:#dff4fb; --gold-light:#ffffff;
    --accent:#7fb8d4; --accent-light:#bfe3f0;
    --bg1:#2c4a5c; --bg2:#16303d; --bg3:#050f14;
  }
  /* マップ7「天上界」のテーマカラー(白に黄色/金色が混じる雲のイメージ)。 */
  body.map7{
    --gold:#f5cf6b; --gold-light:#ffe9a8;
    --accent:#c9a227; --accent-light:#e8c869;
    --bg1:#6b5220; --bg2:#3a2c10; --bg3:#140f04;
  }
  /* マップ8「樹木(アマゾンの密林)」のテーマカラー(暗い緑色基調)。ユーザー指定。 */
  body.map8{
    --gold:#5c9c4a; --gold-light:#8ecb72;
    --accent:#2d5423; --accent-light:#4f7a3e;
    --bg1:#1b3315; --bg2:#0e1c0a; --bg3:#050d03;
  }
  /* マップ9「砂漠」のテーマカラー(黄色基調)。ユーザー指定。 */
  body.map9{
    --gold:#f0c419; --gold-light:#ffe066;
    --accent:#b8860b; --accent-light:#d9a521;
    --bg1:#8a6d1f; --bg2:#4a3a10; --bg3:#1a1404;
  }
  /* マップ10「魔王城」のテーマカラー(石造りの建物、灰色基調)。ユーザー指定。 */
  body.map10{
    --gold:#9aa1ab; --gold-light:#c4cad2;
    --accent:#5a616b; --accent-light:#7e8590;
    --bg1:#2e3238; --bg2:#181b1f; --bg3:#08090a;
  }
  /* マップ3限定: 現在地から3マス先までしか見えない「霧」の演出。
     元のタイル種別のクラス(enemy/pit/guardian等)は残したまま、背景色だけを
     一律の暗色で上書きして種別が見た目からわからないようにする。 */
  .tile.fog{
    background:#0c0d10 !important;
    color:#4a4f58 !important;
    border-color:rgba(255,255,255,.06) !important;
    box-shadow:none !important;
  }
  .tile.fog .icon{ opacity:.7; }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Noto Sans JP', sans-serif;
    color:var(--parchment);
    background:radial-gradient(ellipse at top, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    min-height:100vh;
    overflow-x:hidden;
  }
  body.lang-vi{ font-family:'Times New Roman', Times, serif; }
  body.lang-vi h1, body.lang-vi h2, body.lang-vi .card, body.lang-vi .hud, body.lang-vi button, body.lang-vi .hint{
    font-family:'Times New Roman', Times, serif;
  }
  body.lang-ja{ font-family:'Noto Sans JP', sans-serif; }
  body.lang-ja h1, body.lang-ja h2{ font-family:'Noto Serif JP', serif; }

  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px, rgba(255,255,255,.4), transparent),
      radial-gradient(1.5px 1.5px at 90px 80px, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 150px 40px, rgba(255,255,255,.5), transparent),
      radial-gradient(1.5px 1.5px at 210px 120px, rgba(255,255,255,.3), transparent),
      radial-gradient(1px 1px at 260px 20px, rgba(255,255,255,.4), transparent);
    background-repeat:repeat; background-size:300px 200px;
    opacity:.5;
  }
  .app{ position:relative; z-index:1; max-width:760px; margin:0 auto; padding:14px 14px 60px; }

  .devbtn{
    position:fixed; top:10px; right:10px; z-index:60;
    width:36px; height:36px; border-radius:50%;
    background:rgba(15,22,42,.7); border:1px solid rgba(212,160,23,.5);
    color:var(--gold-light); font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .devbtn.logged-in{ border-color:#e08a2e; color:#ff9d33; background:rgba(224,138,46,.18); box-shadow:0 0 8px rgba(255,157,51,.5); }
  .devbtn.muted{ opacity:.55; }

  header.top{ text-align:center; padding:10px 0 6px; }
  header.top h1{
    font-weight:900;
    font-size:clamp(1.15rem, 4.2vw, 1.6rem);
    margin:0 0 2px;
    letter-spacing:.02em;
    color:var(--gold-light);
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  header.top p{ margin:0; font-size:.78rem; color:#e6d9c2; }

  .hud{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(15,22,42,.6);
    border:1px solid rgba(212,160,23,.35);
    border-radius:14px;
    padding:10px 14px;
    margin:10px 0;
    font-size:.82rem;
    flex-wrap:wrap;
  }
  .hud .stat{ white-space:nowrap; }

  /* 所持アイテム表示(インベントリ)(2026-08-22・16回目追加) */
  .inventory-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin:-2px 0 10px; padding:6px 12px;
    background:rgba(15,22,42,.45);
    border:1px solid rgba(212,160,23,.25);
    border-radius:12px;
    font-size:.78rem;
    min-height:18px;
  }
  .inventory-row.empty{ display:none; }
  .inventory-label{ opacity:.75; margin-right:2px; }
  .inv-item{ position:relative; display:inline-flex; }
  .inv-item .inv-icon{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:8px; font-size:1.05rem;
    background:rgba(212,160,23,.15); border:1px solid rgba(212,160,23,.4);
    cursor:default;
  }
  .inv-item .inv-tooltip{
    position:absolute; bottom:calc(100% + 9px); left:50%; transform:translateX(-50%);
    background:#1c1408; color:var(--parchment,#f3e6c8);
    border:1px solid rgba(212,160,23,.6);
    border-radius:10px; padding:8px 10px;
    font-size:.72rem; line-height:1.4; white-space:normal;
    width:max-content; max-width:200px;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .12s ease;
    z-index:70;
  }
  .inv-item .inv-tooltip b{ display:block; margin-bottom:3px; color:var(--gold-light,#f0d78a); }
  .inv-item .inv-tooltip::after{
    content:""; position:absolute; top:100%; left:50%; transform:translateX(-50%);
    border:6px solid transparent; border-top-color:#1c1408;
  }
  .inv-item:hover .inv-tooltip, .inv-item:focus .inv-tooltip{ opacity:1; }
  /* 薬草の個数表示・クリック使用対応(2026-08-28追加) */
  .inv-item.inv-item-clickable .inv-icon{ cursor:pointer; }
  .inv-item.inv-item-clickable .inv-icon:active{ transform:translateY(1px); }
  .inv-count{
    position:absolute; bottom:-4px; right:-4px;
    min-width:15px; height:15px; padding:0 3px;
    display:flex; align-items:center; justify-content:center;
    background:var(--gold,#d4a017); color:#1c1408;
    border-radius:8px; font-size:.62rem; font-weight:700;
    line-height:1; box-shadow:0 1px 3px rgba(0,0,0,.5);
  }

  /* 手動保存ボタンのフィードバック用トースト(2026-08-22・16回目追加) */
  .save-toast{
    position:fixed; top:52px; right:10px; z-index:80;
    background:#1c1408; color:var(--parchment,#f3e6c8);
    border:1px solid rgba(212,160,23,.6);
    border-radius:10px; padding:8px 14px;
    font-size:.8rem;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
    opacity:0; transform:translateY(-6px);
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
  }
  .save-toast.show{ opacity:1; transform:translateY(0); }
  .hud .stat b{ color:var(--gold-light); }

  .board-wrap{
    background:linear-gradient(180deg, color-mix(in srgb, var(--accent) 22%, #223454) 0%, #223454 100%);
    border:2px solid rgba(212,160,23,.4);
    border-radius:18px;
    padding:14px;
    box-shadow:inset 0 2px 12px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.35);
    margin-bottom:14px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:7px;
  }
  .tile{
    position:relative;
    aspect-ratio:1/1;
    border-radius:10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:.56rem;
    line-height:1.1;
    text-align:center;
    padding:2px;
    border:1.5px solid rgba(0,0,0,.25);
    box-shadow:0 2px 0 rgba(0,0,0,.2) inset;
    opacity:.6;
  }
  .tile.cleared{ opacity:.9; }
  .tile .icon{ font-size:1.05rem; }
  .tile .num{ position:absolute; top:2px; left:3px; font-size:.5rem; opacity:.65; font-weight:700;}
  .tile.current{ opacity:1; transform:scale(1.1); box-shadow:0 0 0 3px var(--gold-light), 0 4px 10px rgba(0,0,0,.4); z-index:2; }

  .tile.start{ background:var(--parchment); color:var(--ink); font-weight:700; }
  .tile.king{ background:linear-gradient(160deg,#6a4a1e,#3a2a10); color:var(--gold-light); border:2px solid var(--gold); }
  .tile.dojo{ background:#4a4470; color:#ece8fb; }
  .tile.enemy{ background:#7a2a2a; color:#ffe6e6; }
  .tile.guardian{ background:linear-gradient(160deg,#3a2a1e,#1b1210); color:var(--gold-light); font-weight:700; border:2px solid var(--gold); }
  .tile.officer{ background:linear-gradient(160deg,#5a1e3a,#2a0f1e); color:#ffd6e6; font-weight:700; border:2px solid #c9407a; }
  .tile.pit{ background:#3a2a2a; color:#e6c9c9; }
  .tile.shortcut{ background:var(--gold); color:#3a2a1e; }
  .tile.lost{ background:#8b2635; color:#fbe6e6; }
  .tile.tailwind{ background:#3f6644; color:#eaf3ea; }
  .tile.step{ background:#5a5a5a; color:#eee; }
  .tile.herb{ background:#3f7a4a; color:#eaffea; }
  .tile.shop{ background:#7a5a1e; color:#fff3d6; }
  .tile.blank{ background:#33405c; color:#c9d3ea; }
  .tile.amulet{ background:#2a5a7a; color:#eaf6ff; }
  .tile.climbBoots{ background:#5a4530; color:#fff0d9; }

  .token{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:1.25rem; pointer-events:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));
    animation:bob 1.4s ease-in-out infinite;
  }
  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

  .controls{
    display:flex; flex-direction:column; align-items:center; gap:10px;
    background:rgba(15,22,42,.6);
    border:1px solid rgba(212,160,23,.35);
    border-radius:14px;
    padding:16px;
  }
  .dice-wrap{ perspective:400px; }
  .dice{
    width:76px; height:76px; border-radius:16px;
    background:linear-gradient(155deg,#ffffff,var(--parchment) 60%, var(--parchment-dark));
    color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    font-size:2.6rem; line-height:1;
    box-shadow:0 5px 0 var(--parchment-dark), 0 12px 22px rgba(0,0,0,.45), inset 0 0 0 2px rgba(0,0,0,.06);
    user-select:none;
    cursor:pointer;
  }
  .dice:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--parchment-dark), 0 6px 12px rgba(0,0,0,.35); }
  .dice.disabled{ cursor:not-allowed; opacity:.6; filter:grayscale(.3); }
  .dice.rolling{ animation: diceTumble .55s linear infinite; }
  @keyframes diceTumble{
    0%   { transform: translateY(0)    rotate(0deg)   rotateX(0deg)   scale(1); }
    15%  { transform: translateY(-16px) rotate(80deg)  rotateX(120deg) scale(1.1); }
    30%  { transform: translateY(4px)  rotate(160deg) rotateX(240deg) scale(0.9); }
    45%  { transform: translateY(-20px) rotate(220deg) rotateX(360deg) scale(1.12); }
    60%  { transform: translateY(2px)  rotate(280deg) rotateX(480deg) scale(0.94); }
    80%  { transform: translateY(-10px) rotate(330deg) rotateX(600deg) scale(1.05); }
    100% { transform: translateY(0)    rotate(360deg) rotateX(720deg) scale(1); }
  }
  .dice.settle{ animation: diceSettle .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes diceSettle{
    0%  { transform: scale(1.4) rotate(14deg); }
    55% { transform: scale(0.85) rotate(-6deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }

  button.primary{
    font-weight:700;
    font-size:1rem;
    padding:12px 30px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    color:#2c1d10;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    box-shadow:0 4px 0 #a67a10, 0 8px 18px rgba(0,0,0,.35);
  }
  button.primary:active{ transform:translateY(3px); box-shadow:0 1px 0 #a67a10; }
  body.map2 button.primary{ box-shadow:0 4px 0 #2f5a1c, 0 8px 18px rgba(0,0,0,.35); }
  body.map2 button.primary:active{ box-shadow:0 1px 0 #2f5a1c; }
  body.map2 .controls{ border-color:rgba(111,174,74,.4); }
  body.map3 button.primary{ box-shadow:0 4px 0 #8a5c26, 0 8px 18px rgba(0,0,0,.5); }
  body.map3 button.primary:active{ box-shadow:0 1px 0 #8a5c26; }
  body.map3 .controls{ border-color:rgba(201,138,62,.35); }
  body.map4 button.primary{ box-shadow:0 4px 0 #145868, 0 8px 18px rgba(0,0,0,.35); }
  body.map4 button.primary:active{ box-shadow:0 1px 0 #145868; }
  body.map4 .controls{ border-color:rgba(79,195,224,.4); }
  body.map5 button.primary{ box-shadow:0 4px 0 #5c1010, 0 8px 18px rgba(0,0,0,.5); }
  body.map5 button.primary:active{ box-shadow:0 1px 0 #5c1010; }
  body.map5 .controls{ border-color:rgba(212,58,47,.4); }
  body.map6 button.primary{ box-shadow:0 4px 0 #2c4a5c, 0 8px 18px rgba(0,0,0,.35); }
  body.map6 button.primary:active{ box-shadow:0 1px 0 #2c4a5c; }
  body.map6 .controls{ border-color:rgba(127,184,212,.4); }
  body.map7 button.primary{ box-shadow:0 4px 0 #6b5220, 0 8px 18px rgba(0,0,0,.35); }
  body.map7 button.primary:active{ box-shadow:0 1px 0 #6b5220; }
  body.map7 .controls{ border-color:rgba(201,162,39,.4); }
  body.map8 button.primary{ box-shadow:0 4px 0 #1b3315, 0 8px 18px rgba(0,0,0,.5); }
  body.map8 button.primary:active{ box-shadow:0 1px 0 #1b3315; }
  body.map8 .controls{ border-color:rgba(93,156,74,.4); }
  body.map9 button.primary{ box-shadow:0 4px 0 #8a6d1f, 0 8px 18px rgba(0,0,0,.35); }
  body.map9 button.primary:active{ box-shadow:0 1px 0 #8a6d1f; }
  body.map9 .controls{ border-color:rgba(240,196,25,.4); }
  body.map10 button.primary{ box-shadow:0 4px 0 #2e3238, 0 8px 18px rgba(0,0,0,.5); }
  body.map10 button.primary:active{ box-shadow:0 1px 0 #2e3238; }
  body.map10 .controls{ border-color:rgba(154,161,171,.4); }
  button.primary:disabled{ opacity:.5; cursor:not-allowed; filter:grayscale(.3); }
  button.secondary{
    font-weight:700;
    padding:9px 18px;
    border-radius:999px;
    border:2.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    margin:10px 4px 4px;
  }
  button.secondary:hover{ background:rgba(58,42,30,.08); }
  button.secondary:disabled{ opacity:.4; cursor:not-allowed; }
  .hint{ font-size:.78rem; color:#e6d9c2; text-align:center; min-height:1.2em; }

  .overlay{
    position:fixed; inset:0; background:rgba(10,14,26,.75);
    display:flex; align-items:center; justify-content:center;
    padding:18px; z-index:50;
  }
  .card{
    background:var(--parchment);
    color:var(--ink);
    border-radius:18px;
    max-width:480px; width:100%;
    padding:24px 22px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
    border:3px solid var(--gold);
    text-align:center;
    max-height:88vh; overflow-y:auto;
  }
  .card h2{ font-size:1.2rem; margin:0 0 10px; }
  .card p{ font-size:.92rem; line-height:1.7; margin:0 0 12px; }
  .help-item{ text-align:left; margin:0 0 14px; padding:0 0 12px; border-bottom:1px solid rgba(150,110,40,.25); }
  .help-item:last-of-type{ border-bottom:none; padding-bottom:0; }
  .help-vi{ font-size:.92rem; line-height:1.6; margin:0 0 4px; font-weight:600; }
  .help-ja{ font-size:.86rem; line-height:1.6; margin:0; opacity:.8; }
  .badge{
    display:inline-block; font-size:.68rem; font-weight:700;
    background:var(--accent); color:#fff; padding:3px 10px; border-radius:999px;
    margin-bottom:10px; letter-spacing:.03em;
  }
  .qtext{ font-size:1.08rem; font-weight:700; margin:6px 0 16px; line-height:1.9; }
  /* 質問文・選択肢中の漢字に振るふりがな(ルビ)の表示調整(2026-08-22・15回目追加) */
  .qtext ruby, .choice-btn ruby{ ruby-position:over; }
  .qtext rt, .choice-btn rt{ font-size:.55em; font-weight:400; color:inherit; opacity:.85; user-select:none; }
  .choices{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:6px; }
  .choice-btn{
    font-size:.92rem;
    padding:12px 6px;
    border-radius:12px;
    border:2px solid var(--accent);
    background:#fff;
    cursor:pointer;
  }
  .choice-btn:disabled{ cursor:default; }
  .choice-btn.correct{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .choice-btn.wrong{ background:#8b2635; color:#fff; border-color:#8b2635; }
  .feedback{ font-size:.88rem; margin-top:10px; min-height:1.4em; font-weight:700; }
  .feedback.ok{ color:#3f6644; }
  .feedback.no{ color:#8b2635; }
  .final-emoji{ font-size:2.6rem; margin-bottom:8px; }
  /* 単語/文字バブル並べ替え問題(2026-08-24・29回目追加。LV22の並べ替え問題、
     番人の単語並べ替え問題で共通使用)。上段(bubble-answer)は解答欄、下段(bubble-pool)は
     まだ使っていないバブルの置き場で、タップで両者を行き来する。 */
  .scramble-hint{ font-size:.8rem; color:#6a5a4a; margin:0 0 10px; }
  .bubble-answer{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    min-height:46px; padding:8px; margin-bottom:10px;

    font-size:1rem;

    border-radius:10px;
    border:2px solid var(--accent);
    background:#fff;
    color:var(--ink);
    box-sizing:border-box;
    margin-top:4px;

     +/-ボタン(トグル操作)でも数値を増減できるようにする。 */
  .admin-num-row{ display:flex; align-items:center; gap:8px; margin-top:4px; }
  .admin-num-row .name-input{ margin-top:0; text-align:center; }

     一覧/テーブル部分だけがflex-shrinkで縮む(=残りは常に閉じるボタン等のために確保される)

     画面が低い場合はそれより縮んでボタンが必ず見える。 */

  .admin-wide-card .badge{ display:block; text-align:center; }

  .admin-table th{ background:rgba(212,160,23,.15); position:sticky; top:0; }

  .admin-q-textarea{ min-height:52px; resize:vertical; font-family:inherit; }
  .admin-choice-row{ display:flex; align-items:center; gap:6px; margin-top:6px; }

  .admin-bgm-list{ flex:1 1 auto; min-height:100px; max-height:55vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }

  .opening-screen{

  }
  .opening-bg-img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center;
    opacity:0; transition:opacity .5s ease;
  }
  .opening-bg-img.is-loaded{ opacity:1; }
  .opening-scrim{
    position:absolute; left:0; right:0; bottom:0; height:16%;
    background:linear-gradient(to top, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 100%);
    z-index:1; pointer-events:none;
  }
  .opening-content{
    position:relative; z-index:2; text-align:center; padding:0 20px 22px; max-width:640px;
    opacity:0; transition:opacity .5s ease;
  }
  .opening-content.is-loaded{ opacity:1; }
  .opening-hint{
    font-size:clamp(.8rem, 2.6vw, .95rem); color:var(--parchment);
    text-shadow:0 2px 8px rgba(0,0,0,.9);
    margin:0; animation:openingHintPulse 1.8s ease-in-out infinite;
  }
  @keyframes openingHintPulse{ 0%,100%{ opacity:.7; } 50%{ opacity:1; } }
  body.lang-vi .opening-content{ font-family:'Times New Roman', Times, serif; }
  .opening-loading{
    position:absolute; inset:0; z-index:3;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:#13141c; transition:opacity .4s ease;
  }
  .opening-loading.hidden{ opacity:0; pointer-events:none; }
  .opening-spinner{
    width:38px; height:38px; border-radius:50%;
    border:3px solid rgba(230,215,178,.25); border-top-color:var(--parchment, #e6d7b2);
    animation:openingSpin .9s linear infinite;
  }
  @keyframes openingSpin{ to{ transform:rotate(360deg); } }
  .opening-loading-text{
    font-size:clamp(.85rem, 2.6vw, 1rem); color:var(--parchment);
    text-shadow:0 2px 8px rgba(0,0,0,.9); margin:0;
  }
  body.lang-vi .opening-loading-text{ font-family:'Times New Roman', Times, serif; }

    20:{ title:"普通形(普通体)：動詞・形容詞・名詞", normal:[

    24:{ title:"V-てあげます／V-てもらいます／V-てくれます", normal:[
        {q:"「わたしは 田中さんに 本を 貸してあげました。」 mẫu 「Vてあげます」 diễn tả ai làm gì cho ai?", c:["Người nói(hoặc phía người nói) làm một việc tốt cho người khác","Người khác làm một việc cho người nói","Người nói tự làm cho chính mình","Một mệnh lệnh"], a:0},

        {q:"「田中さんは わたしに 本を 貸してくれました。」 so với 「もらいました」ở câu trên, câu này khác biệt chủ yếu ở đâu?", c:["Cùng một sự việc nhưng đổi chủ ngữ câu sang người CHO(田中さん), nhấn mạnh lòng biết ơn với hành động đó","Nghĩa hoàn toàn khác nhau","Câu này là câu phủ định","Câu này ở thì quá khứ, câu kia ở thì hiện tại"], a:0}],
      hard:[

    25:{ title:"普通形過去＋ら(たら)・V/イA/ナA/Nても", normal:[

      hard:[

    26:{ title:"～んですか・どうして～んですか…～んです", normal:[
        {q:"「A: 顔色が 悪いですね。 どうしたんですか。 B: ちょっと 頭が 痛いんです。」 mẫu 「んですか／んです」 ở đây dùng để làm gì?", c:["Hỏi và giải thích lý do/hoàn cảnh đằng sau một sự việc đã quan sát được","Đưa ra mệnh lệnh","Mời người nghe làm gì đó","Chỉ đơn thuần hỏi giờ giấc"], a:0},
        {q:"「どうして 遅れたんですか。」「電車が 止まったんです。」 câu trả lời sử dụng 「んです」 vì lý do gì?", c:["Để giải thích rõ nguyên nhân đứng sau sự việc(tàu bị dừng) mà người kia đang thắc mắc","Vì đó là câu hỏi","Vì đang phủ định","Vì là mệnh lệnh"], a:0},

      hard:[

        {q:"「レポートを 忘れたんですか。」 So với 「レポートを 忘れましたか。」, câu dùng 「んですか」 thể hiện thái độ gì của người hỏi?", c:["Ngạc nhiên hoặc muốn xác nhận thêm về một tình huống bất ngờ nhận thấy được","Thái độ trung lập, khách quan hoàn toàn giống câu kia","Là câu mệnh lệnh","Là lời mời"], a:0}]},
    27:{ title:"可能動詞・見えます/聞こえます・Nができます", normal:[

    29:{ title:"自動詞＋ています(状態)・Vてしまいます/ました", normal:[

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  // 指定した cellsAsc（昇順のセル番号配列）に events（同じ長さのイベント種別配列）を
  // ランダムに割り当てるが、隣接するセル番号(n, n+1)が同じ種別にならないようにする。
  function assignNoAdjacentDup(cellsAsc, events, maxAttempts){
    maxAttempts = maxAttempts || 400;
    function isValid(map){
      for(const c of cellsAsc){
        if(map[c+1]!==undefined && map[c]===map[c+1]) return false;
      }
      return true;
    }
    for(let attempt=0; attempt<maxAttempts; attempt++){
      const shuffledEvents = shuffle(events);
      const map = {};
      cellsAsc.forEach((c,i)=>{ map[c] = shuffledEvents[i]; });
      if(isValid(map)) return map;
    }
    // フォールバック: 隣接衝突を検出したら他のセルと入れ替えて修復する
    const shuffledEvents = shuffle(events);
    const map = {};
    cellsAsc.forEach((c,i)=>{ map[c] = shuffledEvents[i]; });
    for(let pass=0; pass<30; pass++){
      let fixedAny = false;
      for(const c of cellsAsc){
        if(map[c+1]!==undefined && map[c]===map[c+1]){
          for(const other of cellsAsc){
            if(other===c || other===c+1) continue;
            if(map[other]===map[c+1]) continue;
            if(map[other-1]===map[c+1] || map[other+1]===map[c+1]) continue;
            const tmp = map[other];
            map[other] = map[c+1];
            map[c+1] = tmp;
            fixedAny = true;
            break;
          }
        }
      }
      if(!fixedAny) break;
    }
    return map;
  }

  // 出題は「シャッフルバッグ」方式: プール(normal/hard)ごとに全レベルの問題を1回ずつ
  // 使い切ってから、あらためてシャッフルして次の周を始める。これにより
  // (1)同じ問題が連続で出ない、(2)全ての問題を出し切るまで同じ問題が再登場しない、
  // (3)通常の敵(normal)と番人・幹部・ドラゴン(hard)は完全に別プールなので、
  // 通常の敵の問題が番人等で使われることは絶対にない、を保証する。
  const questionBags = { normal:[], hard:[] };
  const lastDrawnQuestion = { normal:null, hard:null };
  // マップごとに出題するLVの範囲を分ける(マップ1=LV0〜3、マップ2=LV4〜9、...)。
  // 前のマップで習った内容が後のマップで蒸し返されたり、逆に後の内容が前のマップに混ざったりしない。
  // マップ8・9のLV範囲(29〜31/32〜33)は、当初の構想メモにあった「マップ8=LV29〜31、
  // マップ9=LV31〜33」という重複(31が両方に含まれる)を解消し、境界を31/32で分けている。
  // これは幹部(中ボス)の出現課リスト(14,17,18,22,25,27,31,33)ともちょうど整合しており、
  // LV31の幹部はマップ8に、LV33の幹部はマップ9に、それぞれ過不足なく1体ずつ収まる。
  const MAP_LEVEL_RANGES = { 1:[0,1,2,3], 2:[4,5,6,7,8,9], 3:[10,11,12,13], 4:[14,15,16], 5:[17,18,19,20], 6:[21,22,23,24,25], 7:[26,27,28], 8:[29,30,31], 9:[32,33], 10:[34,35] };
  // ドラゴン(ラスボス)戦の問題は、マップ10だけの範囲(LV34〜35)に限定せず、当初の構想通り

  // 「上書きレイヤー」として保存し、出題時にLEVELSの元データの上にこの上書きを重ねて使う設計に
  // した(元のLEVELSデータ自体は書き換えない)。管理者がこの画面で保存した端末でのみ有効。
  const QUESTION_OVERRIDE_KEY = "adv_question_overrides";

  // 出題ロジック(buildQuestionBag/buildDragonQuestionBag)は必ずこの関数経由でLEVELSを読む。
  function getQuestionBank(lv, pool){
    const base = LEVELS[lv] && LEVELS[lv][pool];
    if(!base) return base;
    return base.map((q,idx)=>{
      const ov = questionOverrides[lv+":"+pool+":"+idx];
      return ov ? { q:ov.q, c:ov.c.slice(), a:ov.a } : q;
    });
  }

    for(const lv of range){

      if(bank) all.push(...bank);
    }
    const bag = shuffle(all);
    // 前の周の最後に出た問題と、今回の周の最初の問題が同じにならないよう入れ替える
    if(bag.length>1 && bag[0]===lastDrawnQuestion[pool]){
      const swapIdx = 1 + Math.floor(Math.random()*(bag.length-1));
      [bag[0], bag[swapIdx]] = [bag[swapIdx], bag[0]];
    }
    return bag;
  }

  // マップ7: 天上界。雲に乗って軽やかに進めるイメージで、「1つ進む(step forward)」と
  // 「追い風(tailwind)」セルを他マップより多めに配置する(仕様メモ「『1つ進む』『追い風』セルが多い」に対応)。
  // 幹部はLV27の1体のみ。
  function buildMap7(){
    const cellMap = {};

    const officerCells = OFFICER_CELLS[7]; // [15] (LV27の幹部)
    officerCells.forEach(c=>{ cellMap[c] = {type:"officer"}; });

    const cellsAsc = []; for(let i=2;i<=29;i++) if(!officerCells.includes(i)) cellsAsc.push(i); // 28-1=27マス

    const events = [];
    const pushN = (type,n)=>{ for(let i=0;i<n;i++) events.push(type); };
    pushN("enemy",8);
    pushN("pit",2);
    pushN("herb",2);
    pushN("shop",2);

    cellsAsc.forEach(c=>{
      const ev = assignment[c];

  // マップ8: 樹木(アマゾンの密林のようなイメージ、暗い緑色基調)。ユーザー指定により、

  function buildMap8(){

    pushN("herb",6); // 当初案(2倍=4)からさらに増やして3倍(ユーザー指定)
    pushN("shop",2);

    pushN("lost",5); // 標準(2)より多め(密林で迷いやすい、仕様通り)
    pushN("tailwind",1); // 密林の中は風が通りにくいため標準(2)より少なめ
    pushN("step",1); // 足場が悪く1歩の恩恵を受けにくいため標準(2)より少なめ
    // 合計 7+4+6+2+1+5+1+1=27

    const assignment = assignNoAdjacentDup(cellsAsc, events);
    cellsAsc.forEach(c=>{

  function buildMap9(){

  const ICONS = {

  function tileVisual(cellNum){
    const ev = state.cellMap[cellNum];
    let cls = ev.type;
    let icon = ICONS[ev.type] || "❓";
    let label = "";
    if(ev.type==="dojo"){
      label = ev.dojo==="combat" ? "⚔️" : ev.dojo==="defense" ? "🛡️" : "🎒";
    }
    return {cls, icon, label};
  }

  function buildBoard(){
    boardEl.innerHTML = "";
    for(let i=1;i<=TOTAL_CELLS;i++){
      const row = Math.floor((i-1)/COLS);
      const posInRow = (i-1) % COLS;
      const col = (row % 2 === 0) ? posInRow : (COLS-1-posInRow);
      const totalRows = Math.ceil(TOTAL_CELLS/COLS);
      const gridRow = totalRows - row;

      const v = tileVisual(i);
      const div = document.createElement("div");
      div.className = "tile " + v.cls;
      div.style.gridColumn = (col+1);
      div.style.gridRow = gridRow;
      div.id = "cell-"+i;
      div.dataset.icon = v.icon;
      div.dataset.label = v.label;
      div.innerHTML = `<span class="num">${i}</span><span class="icon">${v.icon}</span><span>${v.label}</span>`;
      boardEl.appendChild(div);
    }
    placeToken();
    syncDiceSize();
  }

  function placeToken(){
    document.querySelectorAll(".tile").forEach(el=>{
      el.classList.remove("current");
      const tok = el.querySelector(".token");
      if(tok) tok.remove();
    });
    const curNum = state.cellIdx+1;
    for(let i=1;i<curNum;i++){
      const el = document.getElementById("cell-"+i);
      if(el) el.classList.add("cleared");
    }
    const cur = document.getElementById("cell-"+curNum);
    if(!cur) return;
    cur.classList.add("current");
    const tok = document.createElement("div");
    tok.className = "token";
    tok.textContent = "🧝";
    cur.appendChild(tok);
    cur.scrollIntoView({behavior:"smooth", block:"center", inline:"center"});
    applyFogOfWar(curNum);
    scheduleAutoSave();
  }

  // マップ3「洞窟」・マップ10「魔王城」専用: 現在地から一定マス先までしか見えない「霧」の演出。
  // マップごとに見える範囲(半径)が異なる(マップ3=3マス、マップ10=5マス、ユーザー指定)。
  // state.cellMapの中身自体は変更せず(ゲームロジックはそのまま参照可能)、
  // DOM上の見た目(アイコン・ラベル・背景色)だけを一時的に隠す。
  const FOG_RADIUS = { 3:3, 10:5 };
  function applyFogOfWar(curNum){
    const radius = FOG_RADIUS[state.currentMap];
    if(!radius){
      // 霧のかかるマップ以外では霧を一切かけない(念のため既存の霧表示を解除)
      document.querySelectorAll(".tile.fog").forEach(el=>{
        el.classList.remove("fog");
        const iconSpan = el.querySelector(".icon");
        if(iconSpan && el.dataset.icon) iconSpan.textContent = el.dataset.icon;
        const spans = el.querySelectorAll("span");
        if(spans[2] && el.dataset.label!==undefined) spans[2].textContent = el.dataset.label;
      });
      return;
    }
    const visibleUpTo = curNum + radius;
    for(let i=1;i<=TOTAL_CELLS;i++){
      const el = document.getElementById("cell-"+i);
      if(!el) continue;
      const iconSpan = el.querySelector(".icon");
      const spans = el.querySelectorAll("span");
      const labelSpan = spans[2];
      if(i <= visibleUpTo){
        el.classList.remove("fog");
        if(iconSpan) iconSpan.textContent = el.dataset.icon || iconSpan.textContent;
        if(labelSpan) labelSpan.textContent = el.dataset.label || "";
      } else {
        el.classList.add("fog");
        if(iconSpan) iconSpan.textContent = "❓";
        if(labelSpan) labelSpan.textContent = "";
      }
    }
  }

  /* 所持アイテム(インベントリ)一覧(2026-08-22・16回目追加)。

  const INVENTORY_ITEMS = [
    { icon:"📜", has:()=>state.hasOrderScroll, nameKey:"itemOrderScroll", descKey:"itemOrderScrollDesc" },
    { icon:"🧪", has:()=>state.hasElixir, nameKey:"itemElixir", descKey:"itemElixirDesc" },

  // 薬草をインベントリーから使う(2026-08-28追加): ライフが満タンの時に拾った薬草だけ
  // 即時消費せずに個数管理し、アイコンをクリックした時にだけ1個消費してライフを1回復する。
  function useHerbFromInventory(){
    if(state.busy) return;
    if(!(state.herbCount>0)) return;
    if(state.life>=state.maxLife) return;
    state.herbCount -= 1;
    state.life = Math.min(state.maxLife, state.life+1);
    renderHUD();
  }

  function renderInventory(){
    const row = document.getElementById("inventoryRow");
    if(!row) return;
    const held = INVENTORY_ITEMS.filter(it=>it.has());
    const herbHeld = (state.herbCount||0) > 0;
    if(held.length===0 && !herbHeld){
      row.className = "inventory-row empty";
      row.innerHTML = "";
      return;
    }
    row.className = "inventory-row";
    const herbHtml = herbHeld ? `
      <span class="inv-item inv-item-clickable" id="invHerbBtn" tabindex="0">
        <span class="inv-icon">🌿<span class="inv-count">${state.herbCount}</span></span>
        <span class="inv-tooltip"><b>${t("itemHerb")}</b>${t("itemHerbDesc")}</span>
      </span>
    ` : "";
    row.innerHTML = `<span class="inventory-label">${t("inventoryLabel")}</span>` + herbHtml + held.map(it=>`
      <span class="inv-item" tabindex="0">
        <span class="inv-icon">${it.icon}</span>
        <span class="inv-tooltip"><b>${t(it.nameKey)}</b>${t(it.descKey)}</span>
      </span>
    `).join("");
    if(herbHeld){
      const btn = document.getElementById("invHerbBtn");
      btn.onclick = useHerbFromInventory;
      btn.addEventListener("keydown", (e)=>{ if(e.key==="Enter" || e.key===" "){ e.preventDefault(); useHerbFromInventory(); } });
    }
  }

  function gainExp(n){
    state.exp += n;
    while(state.exp >= 100){
      state.exp -= 100;
      // ヘルプ文言(「経験値が100たまるとライフの上限が1増える」)通りに、
      // ライフの上限(maxLife)自体を1増やす。以前はここでmaxLifeを変えずに
      // 現在ライフをMath.min(maxLife, life+1)で回復するだけだったため、
      // ライフが満タンの時にExpが100たまっても何も起きない(回復もしない)という
      // 不具合になっていた。上限を先に増やしてから現在ライフも1回復させることで、
      // 満タン時でも必ず効果が反映されるようにする。
      state.maxLife += 1;
      state.life = Math.min(state.maxLife, state.life+1);
    }
    renderHUD();
  }

  const FURIGANA_MAP = new Map(FURIGANA_WORDS);
  // 長い語(複合語)から先に一致させることで、単漢字の対応表による部分一致の誤変換を防ぐ
  const FURIGANA_ALT = FURIGANA_WORDS.map(w=>w[0]).sort((a,b)=>b.length-a.length)
    .map(w=> w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  // 「人」「日」は前後の文脈(数字/国名など)によって読みが変わるため、辞書とは別に先読みで処理する
  const FURIGANA_RE = new RegExp(
    "(ブラジル)(人)|([0-9])(日)|([0-9])(人)|(" + FURIGANA_ALT + ")", "g"
  );
  function addFurigana(text){
    if(!text) return text;
    return text.replace(FURIGANA_RE, (m, brz, brzJin, dNichi, nichi, dNin, nin, word) => {
      if(brz !== undefined){ return brz + "<ruby>"+brzJin+"<rt>じん</rt></ruby>"; }
      if(dNichi !== undefined){ return dNichi + "<ruby>"+nichi+"<rt>にち</rt></ruby>"; }
      if(dNin !== undefined){ return dNin + "<ruby>"+nin+"<rt>にん</rt></ruby>"; }
      return "<ruby>"+word+"<rt>"+FURIGANA_MAP.get(word)+"</rt></ruby>";
    });
  }

  function showQuiz(question, badgeText, onDone){
    // 選択肢の表示順を毎回シャッフルする(正解が毎回同じ位置(1番目)に固定されてしまう問題への対応)。
    // question.c/question.a 自体は書き換えず、表示用の並び替え配列(order)だけをこの描画で使う。
    // order[表示位置] = 元の配列(question.c)でのインデックス、という対応表。
    const order = shuffle(question.c.map((_,i)=>i));
    const displayedChoices = order.map(origIdx=>question.c[origIdx]);
    const correctDisplayIdx = order.indexOf(question.a);
    openModal(`
      <div class="card">
        <div class="badge">${badgeText}</div>
        <div class="qtext">${addFurigana(question.q)}</div>
        <div class="choices" id="choicesWrap">
          ${displayedChoices.map((c,i)=>`<button class="choice-btn" data-i="${i}"><span>${addFurigana(c)}</span></button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    `);
    const wrap = document.getElementById("choicesWrap");
    const fb = document.getElementById("fb");
    wrap.querySelectorAll(".choice-btn").forEach(btn=>{
      btn.onclick = ()=>{
        wrap.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true);
        const i = Number(btn.dataset.i);
        const isCorrect = (i===correctDisplayIdx);
        if(isCorrect){
          btn.classList.add("correct");
          fb.textContent = t("correct");
          fb.className = "feedback ok";
        } else {
          btn.classList.add("wrong");
          wrap.children[correctDisplayIdx].classList.add("correct");
          fb.textContent = t("wrong");
          fb.className = "feedback no";
        }
        setTimeout(()=>{ closeModal(); onDone(isCorrect); }, 850);
      };
    });
  }

  function normalizeConjAnswer(s){
    return (s||"").replace(/[\s　]+/g, "").trim();
  }
  function showConjugateQuiz(item, formType, badgeText, onDone){
    const promptKey = formType==="teForm" ? "conjugateTeFormPrompt" : "conjugateDictFormPrompt";
    const correctKana = formType==="teForm" ? item.teKana : item.dictKana;
    const correctKanji = formType==="teForm" ? item.te : item.dict;
    openModal(`
      <div class="card">
        <div class="badge">${badgeText}</div>
        <div class="qtext">${t(promptKey, addFurigana(item.masu))}</div>
        <input type="text" id="conjInput" class="name-input" placeholder="${t("conjugateInputPlaceholder")}" autocomplete="off" autocapitalize="off" spellcheck="false">
        <br><button class="primary" id="conjSubmitBtn" style="margin-top:12px;">${t("conjugateSubmitBtn")}</button>
        <div class="feedback" id="fb"></div>
      </div>
    `);
    const input = document.getElementById("conjInput");
    const btn = document.getElementById("conjSubmitBtn");
    const fb = document.getElementById("fb");
    input.focus();
    const submit = ()=>{
      if(input.disabled) return;
      const given = normalizeConjAnswer(input.value);
      const isCorrect = given.length>0 && (given===correctKana || given===correctKanji);
      input.disabled = true;
      btn.disabled = true;
      if(isCorrect){
        fb.textContent = t("correct");
        fb.className = "feedback ok";
      } else {
        fb.textContent = t("wrong")+" "+t("conjugateAnswerRevealLabel")+correctKanji+"（"+correctKana+"）";
        fb.className = "feedback no";
      }
      setTimeout(()=>{ closeModal(); onDone(isCorrect); }, 1200);
    };
    btn.onclick = submit;
    input.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); });
  }

  function showBubbleQuiz(units, badgeText, hintText, revealSep, onDone){
    const ids = units.map((_,i)=>i);
    let poolIds = shuffle(ids.slice());
    let answerIds = [];
    let locked = false;
    openModal(`
      <div class="card">
        <div class="badge">${badgeText}</div>
        <p class="scramble-hint">${hintText}</p>
        <div class="bubble-answer" id="bubbleAnswer"></div>
        <div class="bubble-pool" id="bubblePool"></div>
        <div class="feedback" id="fb"></div>
      </div>
    `);
    const answerEl = document.getElementById("bubbleAnswer");
    const poolEl = document.getElementById("bubblePool");
    const fb = document.getElementById("fb");
    function render(){
      answerEl.innerHTML = answerIds.map(id=>`<button class="bubble-btn" data-id="${id}" ${locked?"disabled":""}>${units[id]}</button>`).join("");
      poolEl.innerHTML = poolIds.map(id=>`<button class="bubble-btn" data-id="${id}" ${locked?"disabled":""}>${units[id]}</button>`).join("");
      answerEl.querySelectorAll(".bubble-btn").forEach(b=>{
        b.onclick = ()=>{
          if(locked) return;
          const id = Number(b.dataset.id);
          answerIds = answerIds.filter(x=>x!==id);
          poolIds.push(id);
          render();
        };
      });
      poolEl.querySelectorAll(".bubble-btn").forEach(b=>{
        b.onclick = ()=>{
          if(locked) return;
          const id = Number(b.dataset.id);
          poolIds = poolIds.filter(x=>x!==id);
          answerIds.push(id);
          render();
          if(answerIds.length===units.length){ check(); }
        };
      });
    }
    function check(){
      locked = true;
      const arranged = answerIds.map(id=>units[id]);
      const isCorrect = arranged.every((w,i)=>w===units[i]);
      answerEl.className = "bubble-answer " + (isCorrect ? "bubble-correct" : "bubble-wrong");
      if(isCorrect){
        fb.textContent = t("correct");
        fb.className = "feedback ok";
      } else {
        fb.textContent = t("wrong")+" "+t("scrambleAnswerRevealLabel")+units.join(revealSep);
        fb.className = "feedback no";
      }
      render();
      setTimeout(()=>{ closeModal(); onDone(isCorrect); }, 1200);
    }
    render();
  }

  // サイコロの絵をマスと同じ大きさに揃える(盤面はレスポンシブなので実測して合わせる)
  function syncDiceSize(){
    const tile = boardEl.querySelector(".tile");
    if(!tile) return;
    const rect = tile.getBoundingClientRect();
    const size = Math.round(Math.min(rect.width, rect.height));
    if(size <= 0) return;
    diceEl.style.width = size + "px";
    diceEl.style.height = size + "px";
    diceEl.style.fontSize = Math.max(14, Math.round(size * 0.5)) + "px";
    diceEl.style.borderRadius = Math.max(6, Math.round(size * 0.18)) + "px";
  }
  window.addEventListener("resize", syncDiceSize);

  // 直前に出た目と同じ目が連続で出ないようにする
  function rollFinalValue(){
    const candidates = [1,2,3,4,5,6].filter(v => v !== state.lastDiceRoll);
    const roll = candidates[Math.floor(Math.random()*candidates.length)];
    state.lastDiceRoll = roll;
    return roll;
  }

  // マップ4(水のエリア)・マップ9(砂漠)限定: 水/砂の抵抗でサイコロの目の半分ほどしか進めない。
  // 出た目そのもの(ダイスの絵)は変えず、実際に進むマス数だけをこの対応表で変換する。
  // マップ9もユーザー指定により同じ換算表を使う(「前に進みにくい」という同じ趣旨のため)。
  const HALVED_DICE_STEPS = { 1:0, 2:1, 3:2, 4:2, 5:2, 6:3 };
  function stepsForRoll(roll){
    if(state.currentMap===4 || state.currentMap===9) return HALVED_DICE_STEPS[roll];
    return roll;
  }

  // ユーザー指定(2026-08-23・22回目): 幹部(中ボス)がいるマップでは、サイコロの目が
  // どんな数であっても、幹部のマスを通り過ぎて先に進むことはできない。サイコロの出目通りに
  // 進むと幹部のマスを飛び越してしまう場合は、必ず幹部のマスで止まって戦闘になるよう、
  // 実際に進むマス数をその場で短く切り詰める(出目自体の表示は変えない。マップ4・9の
  // 「水/砂の抵抗」による短縮と同じ考え方)。マップに幹部が2体いる場合は、現在地から近い方の
  // 幹部で止める。
  // ユーザー指定(2026-08-23・23回目): マップ1(王城の城下町)でも同様に、サイコロの目が
  // どんな数であっても王城(FIXED.king)のマスを通り過ぎることはできない。強制停止するマスの
  // 一覧を、幹部がいるマップでは幹部のマス、マップ1では王城のマスとして返す。
  function forcedStopCells(mapNum){
    if(mapNum===1) return [FIXED.king];
    return OFFICER_CELLS[mapNum];
  }
  function capStepsAtOfficer(steps){
    if(steps<=0) return steps;
    const stopCells = forcedStopCells(state.currentMap);
    if(!stopCells) return steps;
    const curNum = state.cellIdx+1;
    const destNum = curNum+steps;
    const candidates = stopCells.filter(oc=> oc>curNum && oc<=destNum);
    if(candidates.length===0) return steps;
    return Math.min(...candidates) - curNum;
  }

  function setBusy(b){ state.busy = b; diceEl.classList.toggle("disabled", b); }

  function stepMove(delta, cb){
    const dir = delta>0?1:-1;
    let remaining = Math.abs(delta);
    const timer = setInterval(()=>{
      const nextCell = state.cellIdx+1+dir;
      if(remaining<=0 || nextCell<1 || nextCell>TOTAL_CELLS){
        clearInterval(timer);
        placeToken();
        cb();
        return;
      }
      state.cellIdx += dir;
      remaining--;
      placeToken();
    }, 200);
  }

  function warpTo(cellNum, cb){
    state.cellIdx = cellNum-1;
    placeToken();
    cb();
  }

  function endTurn(){
    setBusy(false);
    hintEl.textContent = t("hintRoll");
    moveChainVisited = null;
  }

  // 近道(+3)/迷い道(-3)/追い風(+2)/1歩(±1)のように「着地すると自動的にまた移動する」
  // イベントどうしが、盤面の配置次第でお互いを打ち消し合う位置関係になっていると
  // (例: 近道の着地先がちょうど3マス戻る迷い道になっている等)、resolveCell()が
  // 無限に自分自身を呼び出し続けてしまい、ゲームが固まる/絶対に前に進めなくなる
  // ("永遠に前に進めない")という致命的なバグになり得る。
  // これを防ぐため、1回のサイコロ操作(ターン)の中で同じマスに2回着地したら、
  // それはループが発生しているとみなしてチェーンをそこで打ち切る(安全にターン終了)。
  let moveChainVisited = null;

  function trainedForPractice(){ return state.dojoCombatDone && state.dojoDefenseDone; }

  // ユーザー指定(2026-08-23・26回目): 通常戦闘(敵/幹部/番人)で誤答した場合、この確率で
  // 「攻撃を防いだ」判定になりライフが減らない(それ以外の誤答は通常通りライフ-1)。
  const WRONG_ANSWER_DEFENSE_CHANCE = 0.05;

  // ユーザー指定(2026-08-23・26回目): 通常戦闘で正答した場合、この確率で「クリティカル
  // ヒット」判定になり、相手のライフが通常の1ではなく2減る。
  const CRITICAL_HIT_CHANCE = 0.05;

  // kind: "enemy"(通常の敵) / "guardian"(マップ最後尾の番人) / "officer"(幹部・中ボス)。
  // 幹部はマップ中央付近に配置される中ボスで、番人より手強い(ライフ5・難問のみ)が、
  // 倒してもマップクリアにはならず(showMapClearを呼ばない)、通常の敵と同様にターンが続く。
  function resolveEnemyLike(kind){
    const isGuardian = kind==="guardian";
    const isOfficer = kind==="officer";
    const life = isGuardian ? 3 : isOfficer ? 5 : 1;
    // 「練習用」という表現は、城下町(マップ1)の8〜16セルより後にある練習ステージ限定の設定。
    // マップ2以降は本当の冒険の一部として敵と戦う場面なので「練習用」を付けない表記にする。
    // (幹部はマップ1には登場しないため、isPracticeFramingが真になることはない)
    const isPracticeFraming = state.currentMap===1;
    const getTitle = ()=> isGuardian ? t("guardianTitle") : isOfficer ? t("officerTitle") : t(isPracticeFraming ? "enemyTitle" : "enemyTitleReal");
    const icon = isGuardian ? "🛡️" : isOfficer ? "👺" : "👹";

    // ユーザー指定(2026-08-23・25回目): 城下町(マップ1)で番人と出会った時は、3つの道場
    // (戦い方・守り方・道具の使い方)のうち1つでも未修行なら、ダメージなしでスタート(1マス目)
    // まで強制送還する。以下の「戦い方/守り方」のみをチェックする一般の敵向けの分岐とは別に、
    // 番人限定でより厳しく(道具の道場も含めた全3道場を)チェックする。
    if(isGuardian && state.currentMap===1 && !(state.dojoCombatDone && state.dojoDefenseDone && state.dojoItemDone)){
      showEvent(()=> showFlavor(icon, getTitle(), t("guardianAllTrainingNeeded")+"<br>"+t("guardianSentBackCastle"), ()=>{
        warpTo(1, ()=>{ resolveCell(); });
      }));
      return;
    }

    // 戦い方も守り方も未修行 → 即ダメージ + 城(1マス目)まで送還。戻ったマスのイベントも再生する。
    if(!state.dojoDefenseDone && !state.dojoCombatDone){
      loseLife(1);
      showEvent(()=> showFlavor(icon, getTitle(), t("untrainedHurt")+"<br>"+t("sentBackCastle"), ()=>{
        warpTo(1, ()=>{
          checkDeath(()=>{ resolveCell(); });
        });
      }));
      return;
    }
    // 守り方 未修行 → 即ダメージ + 8マス目へ送還。戻ったマスのイベントも再生する。
    if(!state.dojoDefenseDone){
      loseLife(1);
      showEvent(()=> showFlavor(icon, getTitle(), t("untrainedHurt")+"<br>"+t("sentBack"), ()=>{
        warpTo(FIXED.dojoCombat, ()=>{
          checkDeath(()=>{ resolveCell(); });
        });
      }));
      return;
    }
    // 戦い方 未修行 → 練習中は安全だが送還される。戻ったマスのイベントも再生する。
    if(!state.dojoCombatDone){
      showEvent(()=> showFlavor(icon, getTitle(), t("enemyNoTrainNote")+"<br>"+t("sentBack"), ()=>{
        warpTo(FIXED.dojoCombat, ()=>{ resolveCell(); });
      }));
      return;
    }

    // 両方修行済み → 通常の練習戦闘(正解で敵ライフ減少)。
    // ユーザー報告(2026-08-23・26回目)により、誤答時は原則ライフ-1に変更した
    // (それまでは誤答してもライフが減らない仕様だったが、これは意図しない不具合という
    // 扱いで修正した)。ただしユーザー追加指定により、誤答時も5%の確率(WRONG_ANSWER_DEFENSE_CHANCE)
    // で「攻撃を防いだ」として防御に成功しライフは減らない特殊演出を挟む。また正答時も5%の確率
    // (CRITICAL_HIT_CHANCE)で「クリティカルヒット」となり、相手のライフを通常の1ではなく2減らす。
    // 幹部戦だけは専用のBGM(enemy_bgm.mp3)に切り替える。倒した後、下のdefeatedTitle表示直後に
    // 元のマップのテーマBGMへ戻す(番人戦はshowMapClear()→次マップへの遷移で自動的にBGMが変わるため、
    // ここで個別に戻す必要はない)。
    if(isOfficer){ switchBgmTrack(SPECIAL_BGM.officerBattle); }
    let remainingLife = life;
    // ユーザー指定(2026-08-24・29回目): 幹部(中ボス)のうち、LV14=て形・LV18=辞書形・
    // LV22=並べ替えを象徴する幹部だけは、通常の4択(hard)問題ではなく専用の特殊問題
    // タイプを出題する。どの幹部がどのLVを象徴するかはOFFICER_NOMINAL_LEVELで判定する
    // (それ以外のLVの幹部・通常の敵・番人の基本問題は従来通り4択のまま)。
    const officerNominalLv = isOfficer ? (OFFICER_NOMINAL_LEVEL[state.currentMap]||{})[state.cellIdx+1] : null;
    const specialType = officerNominalLv ? SPECIAL_OFFICER_QUESTION_TYPE[officerNominalLv] : null;
    function ask(){
      // 正答/誤答の判定後の共通処理(クリティカルヒット・防御成功・撃破判定等)。
      // 出題UIが4択/手入力/バブル並べ替えのどれであっても、onDone(isCorrect)経由でここに合流する。
      function handleAnswer(correct){
        if(correct){
          gainExp(1);
          const isCritical = Math.random() < CRITICAL_HIT_CHANCE;
          remainingLife -= isCritical ? 2 : 1;
          const afterHit = ()=>{
            if(remainingLife<=0){
              const goldGain = isOfficer ? 8 : isGuardian ? 5 : 1;
              state.gold += goldGain;
              renderHUD();
              const defeatedTitle = isGuardian
                ? t(isPracticeFraming ? "guardianDefeated" : "guardianDefeatedReal")
                : isOfficer
                ? t("officerDefeated")
                : t(isPracticeFraming ? "enemyDefeated" : "enemyDefeatedReal");
              const defeatedNote = isPracticeFraming ? t("practiceDefeatNote", goldGain) : t("defeatGoldNote", goldGain);
              if(isOfficer){ switchBgmTrack(bgmPathForMap(state.currentMap)); }
              showEvent(()=> showFlavor("🏆", defeatedTitle, defeatedNote, ()=>{
                if(isGuardian){ showMapClear(); }
                else { endTurn(); }
              }));
              return;
            }
            setTimeout(ask, 150);
          };
          if(isCritical){
            showEvent(()=> showFlavor("💥", getTitle(), t("criticalHit"), afterHit));
          } else {
            afterHit();
          }
          return;
        }
        // 誤答: 5%の確率で防御に成功しライフは減らない。それ以外は通常通りライフ-1。
        if(Math.random() < WRONG_ANSWER_DEFENSE_CHANCE){
          showEvent(()=> showFlavor("🛡️", getTitle(), t("attackBlocked"), ()=>{
            setTimeout(ask, 150);
          }));
          return;
        }
        loseLife(1);
        checkDeath(()=>{ setTimeout(ask, 150); });
      }

      if(specialType==="teForm" || specialType==="dictForm"){
        const item = randomConjugateVerb(specialType);
        showEvent(()=> showConjugateQuiz(item, specialType, icon+" "+getTitle(), handleAnswer));
        return;
      }
      if(specialType==="scramble"){
        const item = randomScrambleSentence();
        showEvent(()=> showBubbleQuiz(item.words, icon+" "+getTitle(), t("scrambleSentenceHint"), "", handleAnswer));
        return;
      }
      // 番人限定: 10%の確率で通常の4択の代わりに単語(1文字ずつ)並べ替え問題を出題する。
      if(isGuardian && Math.random() < WORD_SCRAMBLE_CHANCE){
        const word = randomScrambleWord();
        showEvent(()=> showBubbleQuiz(word.split(""), icon+" "+getTitle(), t("scrambleWordHint"), "", handleAnswer));
        return;
      }
      const q = (isGuardian || isOfficer) ? randomHardQuestion() : randomQuestion("normal");
      showEvent(()=> showQuiz(q, icon+" "+getTitle(), handleAnswer));
    }
    ask();
  }

  /* =========================================================
     ドラゴン(ラスボス)戦・エンディング(2026-08-23・22回目追加)
     マップ10(魔王城)の30セル目に到達すると、通常の番人ではなくラスボスの
     ドラゴンとの戦闘になる。ユーザー指定により、この戦闘だけは「ドラゴンクエスト
     シリーズのような戦闘画面」に画面が切り替わる: 上部にドラゴンの絵(dragon.jpg)を
     大きく表示し、その下にライフバー・戦闘中の質問/選択肢を配置する(通常の戦闘は
     画面中央の小さいカードのみで進行するが、ドラゴン戦だけ専用レイアウト
     (.dragon-battle-card、showDragonQuiz())に切り替わる)。
     出題プールはマップ10自体のLV範囲(34〜35)には限定せず、当初の構想
     (「第6〜35課の難問30問」)通りLV6〜35の全hard問題から出題する
     (DRAGON_QUESTION_MIN_LEVEL〜MAX_LEVEL、DRAGON_MAX_LIFE=30)。
     (注: 2026-08-23・26回目で通常の敵/幹部/番人戦(resolveEnemyLike())に「誤答時は
     ライフ-1、5%の確率で防御成功しライフ維持、正答時も5%の確率でクリティカルヒット」
     という仕様を追加した際は、30問連続で正答する必要がある特に長丁場の最終決戦という
     理由でドラゴン戦をあえて対象外にしていたが、28回目にユーザーから「ラスボス戦でも
     誤答するとライフが減り、正答するとドラゴンのライフが減る」という明示的な指定を
     受けたため、以下resolveDragonBattle()も通常戦闘と全く同じ仕様(誤答時ライフ-1・
     5%防御成功・正答時5%クリティカルヒット)で統一した)
  ========================================================= */
  let dragonQuestionBag = [];
  function buildDragonQuestionBag(){
    const all = [];
    for(let lv=DRAGON_QUESTION_MIN_LEVEL; lv<=DRAGON_QUESTION_MAX_LEVEL; lv++){
      const bank = getQuestionBank(lv, "hard");
      if(bank) all.push(...bank);
    }
    return shuffle(all);
  }
  function randomDragonQuestion(){
    if(dragonQuestionBag.length===0){ dragonQuestionBag = buildDragonQuestionBag(); }
    return dragonQuestionBag.shift();
  }

  // 通常の戦闘用showQuiz()とは別に、ドラゴン戦専用のドラゴンクエスト風レイアウトで
  // 質問を表示する。question.c/question.a自体は書き換えず、表示順のみシャッフルする
  // (showQuiz()と同じランダム化ロジックをそのまま踏襲)。
  function showDragonQuiz(question, lifeRemaining, onDone){
    const order = shuffle(question.c.map((_,i)=>i));
    const displayedChoices = order.map(origIdx=>question.c[origIdx]);
    const correctDisplayIdx = order.indexOf(question.a);
    const lifePct = Math.max(0, Math.round((lifeRemaining/DRAGON_MAX_LIFE)*100));
    openModal(`
      <div class="card dragon-battle-card">
        <img class="dragon-img" src="public/images/dragon.jpg" alt="dragon">
        <div class="dragon-life-wrap">
          <div class="dragon-life-label">🐉 ${t("dragonLifeLabel")}: ${lifeRemaining}/${DRAGON_MAX_LIFE}</div>
          <div class="dragon-life-bar"><div class="dragon-life-fill" style="width:${lifePct}%"></div></div>
        </div>
        <div class="badge">🐉 ${t("dragonTitle")}</div>
        <div class="qtext">${addFurigana(question.q)}</div>
        <div class="choices" id="choicesWrap">
          ${displayedChoices.map((c,i)=>`<button class="choice-btn" data-i="${i}"><span>${addFurigana(c)}</span></button>`).join("")}
        </div>
        <div class="feedback" id="fb"></div>
      </div>
    `);
    const wrap = document.getElementById("choicesWrap");
    const fb = document.getElementById("fb");
    wrap.querySelectorAll(".choice-btn").forEach(btn=>{
      btn.onclick = ()=>{
        wrap.querySelectorAll(".choice-btn").forEach(b=>b.disabled=true);
        const i = Number(btn.dataset.i);
        const isCorrect = (i===correctDisplayIdx);
        if(isCorrect){
          btn.classList.add("correct");
          fb.textContent = t("correct");
          fb.className = "feedback ok";
        } else {
          btn.classList.add("wrong");
          wrap.children[correctDisplayIdx].classList.add("correct");
          fb.textContent = t("wrong");
          fb.className = "feedback no";
        }
        setTimeout(()=>{ closeModal(); onDone(isCorrect); }, 850);
      };
    });
  }

  function resolveDragonBattle(){
    switchBgmTrack(SPECIAL_BGM.dragonBattle);
    dragonQuestionBag = buildDragonQuestionBag();
    let dragonLife = DRAGON_MAX_LIFE;
    function ask(){
      const q = randomDragonQuestion();
      showEvent(()=> showDragonQuiz(q, dragonLife, (correct)=>{
        if(correct){
          gainExp(1);
          const isCritical = Math.random() < CRITICAL_HIT_CHANCE;
          dragonLife -= isCritical ? 2 : 1;
          const afterHit = ()=>{
            if(dragonLife<=0){
              onDragonDefeated();
              return;
            }
            setTimeout(ask, 150);
          };
          if(isCritical){
            showEvent(()=> showFlavor("💥", t("dragonTitle"), t("criticalHit"), afterHit));
          } else {
            afterHit();
          }
          return;
        }
        // 誤答: 通常戦闘(resolveEnemyLike())と同じく、5%の確率で防御成功しライフは減らない。
        // それ以外は勇者のライフが1減る(2026-08-23・28回目、ユーザー指定によりドラゴン戦にも適用)。
        if(Math.random() < WRONG_ANSWER_DEFENSE_CHANCE){
          showEvent(()=> showFlavor("🛡️", t("dragonTitle"), t("attackBlocked"), ()=>{
            setTimeout(ask, 150);
          }));
          return;
        }
        loseLife(1);
        checkDeath(()=>{ setTimeout(ask, 150); });
      }));
    }
    ask();
  }

  // ドラゴン撃破直後: dragon2.jpg(倒れたドラゴン)を表示する専用の勝利画面。
  // ユーザー指定: goal_bgm.mp3は16秒間の短いファンファーレ曲で、ループさせず、
  // 曲が終わったタイミングで自動的にエンディング(姫の救出)画面へ移行し、そこで
  // BGMをending_bgm.mp3に切り替える。オーディオ要素はBGM全般で常時ループ再生
  // (<audio id="bgm" loop>)する仕様のため、ここだけ一時的にloopを外し、
  // 「ended」イベント(曲が実際に終わったタイミング)を主な合図として使う。
  // ファイル未配置・自動再生ブロック等でendedが発火しないケースに備えて、
  // ユーザー指定の尺と同じ16秒のフォールバックタイマーも用意し、いずれか早い方で進む。
  function onDragonDefeated(){
    bgmEl.loop = false;
    switchBgmTrack(SPECIAL_BGM.goal);
    showDragonDefeatedScreen();
    let advanced = false;
    const onEnded = ()=> advance();
    const advance = ()=>{
      if(advanced) return;
      advanced = true;
      bgmEl.removeEventListener("ended", onEnded);
      bgmEl.loop = true; // 以降のトラック(ending_bgm.mp3等)は通常通りループ再生に戻す
      showPrincessRescue();
    };
    bgmEl.addEventListener("ended", onEnded, {once:true});
    setTimeout(advance, 16000);
  }
  function showDragonDefeatedScreen(){
    activeModalRenderer = showDragonDefeatedScreen;
    openModal(`
      <div class="card dragon-battle-card">
        <img class="dragon-img" src="public/images/dragon2.jpg" alt="dragon defeated">
        <h2>${t("dragonDefeatedTitle")}</h2>
        <p>${t("dragonDefeatedText")}</p>
      </div>
    `);
  }

  // 姫の救出(イベント10)→国王への謁見→結婚/再冒険の選択、というエンディングの流れ。
  // BGMはこの姫の救出シーンからending_bgm.mp3に切り替える。
  function showPrincessRescue(){
    switchBgmTrack(SPECIAL_BGM.ending);
    showEvent(()=> showFlavor("👸", t("princessRescueTitle"), t("princessRescueText", heroDisplayName()), ()=>{
      showKingAudience();
    }));
  }

  function showKingAudience(){
    showEvent(()=> showFlavor("👑", t("kingAudienceTitle"), t("kingAudienceText", heroDisplayName()), ()=>{
      showEndingChoice();
    }));
  }

  function showEndingChoice(){
    activeModalRenderer = showEndingChoice;
    openModal(`
      <div class="card">
        <div class="final-emoji">💍</div>
        <h2>${t("endingChoiceTitle")}</h2>
        <p>${t("endingChoiceText")}</p>
        <button class="primary" id="marryBtn">${t("marryBtn")}</button>
        <br><button class="secondary" id="adventureBtn" style="margin-top:10px;">${t("adventureBtn")}</button>
      </div>
    `);
    document.getElementById("marryBtn").onclick = ()=>{ closeModal(); showWeddingEnding(); };
    document.getElementById("adventureBtn").onclick = ()=>{ closeModal(); showAdventureEnding(); };
  }

  // 結婚エンディング: wedding_bgm.mp3に切り替え、そのままゲーム終了(リトライのみ)。
  function showWeddingEnding(){
    switchBgmTrack(SPECIAL_BGM.wedding);

      activeModalRenderer = ()=> render();

          renderHUD();

              }));
            } else {
              render(t("shopBought", t(item.nameKey))+" "+t("itemLockedNote"));
            }
            return;
          }
          if(item.key==="elixir"){
            state.hasElixir = true;
            render(t("shopBought", t(item.nameKey))+" "+(usable ? t("elixirReadyNote") : t("itemLockedNote")));

          }
          if(item.key==="herb"){
            if(!usable){ render(t("herbTextLocked")); return; }
            if(state.life<state.maxLife){
              state.life = Math.min(state.maxLife, state.life+1);
              renderHUD();
              render(t("herbTextHeal"));
            } else {
              state.herbCount = (state.herbCount||0) + 1;
              renderHUD();
              render(t("herbTextStored"));

          if(item.key==="lifeWater"){

            state.life = Math.min(state.maxLife, state.life+1);
            renderHUD();
            render(t("lifeWaterTextHeal"));
            return;
          }
          render();
        };
      });
      document.getElementById("shopCloseBtn").onclick = ()=>{ closeModal(); endTurn(); };

  function resolveCell(){
    const cellNum = state.cellIdx+1;
    if(!moveChainVisited) moveChainVisited = new Set();
    if(moveChainVisited.has(cellNum)){
      // 同じターンの中で同じマスに再び来た = 移動系イベントどうしがループしている。
      // これ以上イベントを発生させず、その場でターンを終了して無限ループを防ぐ。
      endTurn();
      return;
    }
    moveChainVisited.add(cellNum);

    const ev = state.cellMap[cellNum];

    if(ev.type==="start" || ev.type==="blank"){ endTurn(); return; }

    if(ev.type==="king"){
      if(!state.hasOrderScroll){
        function renderAskName(){
          openModal(`
            <div class="card">
              <div class="final-emoji">👑</div>
              <h2>${t("askNameTitle")}</h2>
              <p>${t("askNameText")}</p>
              <input type="text" id="heroNameInput" class="name-input" maxlength="12" placeholder="${t("nameInputPlaceholder")}" value="${(state.heroName||"").replace(/"/g,"&quot;")}">
              <br><button class="primary" id="nameConfirmBtn" style="margin-top:12px;">${t("nameConfirmBtn")}</button>
            </div>
          `);
          const input = document.getElementById("heroNameInput");
          input.focus();
          function confirmName(){
            state.heroName = input.value.trim();
            state.hasOrderScroll = true;
            state.gold += 15;
            renderHUD();
            showEvent(()=> showFlavor("👑", t("kingTitle"), t("kingTextFirst", heroDisplayName()), endTurn));
          }
          document.getElementById("nameConfirmBtn").onclick = confirmName;
          input.addEventListener("keydown", (e)=>{ if(e.key==="Enter"){ e.preventDefault(); confirmName(); } });
        }
        showEvent(renderAskName);
      } else {
        showEvent(()=> showFlavor("👑", t("kingTitle"), t("kingTextAgain", heroDisplayName()), endTurn));
      }
      return;
    }

    if(ev.type==="dojo"){
      const titleKey = ev.dojo==="combat" ? "dojoCombatTitle" : ev.dojo==="defense" ? "dojoDefenseTitle" : "dojoItemTitle";
      const descKey = ev.dojo==="combat" ? "dojoCombatDesc" : ev.dojo==="defense" ? "dojoDefenseDesc" : "dojoItemDesc";
      const doneFlag = ev.dojo==="combat" ? "dojoCombatDone" : ev.dojo==="defense" ? "dojoDefenseDone" : "dojoItemDone";
      const cost = 5;

      if(!state.hasOrderScroll){
        showEvent(()=> showFlavor("🏯", t(titleKey), t("dojoNeedScroll"), ()=>{
          warpTo(1, ()=>{ resolveCell(); });
        }));
        return;
      }
      if(state[doneFlag]){
        showEvent(()=> showFlavor("🏯", t(titleKey), t("dojoDoneAlready"), endTurn));
        return;
      }
      function renderDojoCard(){
        openModal(`
          <div class="card">
            <div class="badge">🏯 ${t(titleKey)}</div>
            <p>${t(descKey)}</p>
            <p style="font-size:.8rem;color:#6a5a4a;">💰 ${t("gold")}: ${state.gold}</p>
            <button class="primary" id="trainBtn" ${state.gold<cost?"disabled":""}>${t("dojoTrainBtn", cost)}</button>
            <br><button class="secondary" id="skipBtn">${t("shopClose")}</button>
          </div>
        `);
        document.getElementById("trainBtn").onclick = ()=>{
          if(state.gold<cost) return;
          state.gold -= cost;
          state[doneFlag] = true;
          renderHUD();
          closeModal();
          showEvent(()=> showFlavor("✅", t(titleKey), t("dojoTrainedMsg"), endTurn));
        };
        document.getElementById("skipBtn").onclick = ()=>{ closeModal(); endTurn(); };
      }
      showEvent(renderDojoCard);
      return;
    }

    if(ev.type==="enemy"){ resolveEnemyLike("enemy"); return; }
    if(ev.type==="guardian"){ resolveEnemyLike("guardian"); return; }
    if(ev.type==="officer"){ resolveEnemyLike("officer"); return; }
    if(ev.type==="dragon"){ resolveDragonBattle(); return; }

    if(ev.type==="pit"){
      loseLife(1);
      showEvent(()=> showFlavor(ICONS.pit, t("pitTitle"), t("pitText"), ()=>{ checkDeath(endTurn); }));
      return;
    }
    if(ev.type==="drown"){
      loseLife(1);
      showEvent(()=> showFlavor(ICONS.drown, t("drownTitle"), t("drownText"), ()=>{ checkDeath(endTurn); }));
      return;
    }
    if(ev.type==="fire"){
      if(state.hasAmulet){
        showEvent(()=> showFlavor(ICONS.fire, t("fireTitle"), t("fireTextBlocked"), endTurn));
        return;
      }
      loseLife(1);
      showEvent(()=> showFlavor(ICONS.fire, t("fireTitle"), t("fireText"), ()=>{ checkDeath(endTurn); }));
      return;
    }
    if(ev.type==="cactus"){
      loseLife(1);
      showEvent(()=> showFlavor(ICONS.cactus, t("cactusTitle"), t("cactusText"), ()=>{ checkDeath(endTurn); }));
      return;
    }
    if(ev.type==="shortcut"){
      showEvent(()=> showFlavor(ICONS.shortcut, t("shortcutTitle"), t("shortcutText"), ()=>{
        stepMove(3, ()=>{ resolveCell(); });
      }));
      return;
    }
    if(ev.type==="lost"){
      if(state.currentMap===6 && state.hasClimbingBoots){
        showEvent(()=> showFlavor(ICONS.lost, t("lostTitle"), t("lostTextBoots"), endTurn));
        return;
      }
      showEvent(()=> showFlavor(ICONS.lost, t("lostTitle"), t("lostText"), ()=>{
        stepMove(-3, ()=>{ resolveCell(); });
      }));
      return;
    }
    if(ev.type==="tailwind"){
      showEvent(()=> showFlavor(ICONS.tailwind, t("tailwindTitle"), t("tailwindText"), ()=>{
        stepMove(2, ()=>{ resolveCell(); });
      }));
      return;
    }
    if(ev.type==="step"){
      if(ev.dir>0){
        showEvent(()=> showFlavor(ICONS.step, t("stepFwdTitle"), t("stepFwdText"), ()=>{ stepMove(1, ()=>{ resolveCell(); }); }));
      } else {
        showEvent(()=> showFlavor(ICONS.step, t("stepBackTitle"), t("stepBackText"), ()=>{ stepMove(-1, ()=>{ resolveCell(); }); }));
      }
      return;
    }
    if(ev.type==="herb"){
      if(!itemsUsable()){
        showEvent(()=> showFlavor(ICONS.herb, t("herbTitle"), t("herbTextLocked"), endTurn));
        return;
      }
      if(state.life<state.maxLife){
        state.life = Math.min(state.maxLife, state.life+1);
        renderHUD();
        showEvent(()=> showFlavor(ICONS.herb, t("herbTitle"), t("herbTextHeal"), endTurn));
      } else {
        state.herbCount = (state.herbCount||0) + 1;
        renderHUD();
        showEvent(()=> showFlavor(ICONS.herb, t("herbTitle"), t("herbTextStored"), endTurn));
      }
      return;
    }
    if(ev.type==="amulet"){
      if(!itemsUsable()){
        showEvent(()=> showFlavor(ICONS.amulet, t("amuletTitle"), t("amuletTextLocked"), endTurn));
        return;
      }
      state.hasAmulet = true;
      renderHUD();
      showEvent(()=> showFlavor(ICONS.amulet, t("amuletTitle"), t("amuletText"), endTurn));
      return;
    }
    if(ev.type==="climbBoots"){
      if(!itemsUsable()){
        showEvent(()=> showFlavor(ICONS.climbBoots, t("climbBootsTitle"), t("climbBootsTextLocked"), endTurn));
        return;
      }
      state.hasClimbingBoots = true;
      renderHUD();
      showEvent(()=> showFlavor(ICONS.climbBoots, t("climbBootsTitle"), t("climbBootsText"), endTurn));
      return;
    }
    if(ev.type==="shop"){ openShop(); return; }

    endTurn();
  }

  function rollDice(){
    if(state.busy) return;
    moveChainVisited = null; // 新しいターンの開始。前ターンの移動チェーン記録をリセットする
    if(state.cellIdx >= TOTAL_CELLS-1){
      setBusy(true);
      resolveCell();
      return;
    }
    setBusy(true);
    hintEl.textContent = "";
    diceEl.classList.remove("settle");
    diceEl.classList.add("rolling");
    let ticks = 0;
    const maxTicks = 14;
    const tickTimer = setInterval(()=>{
      diceEl.textContent = DICE_FACES[Math.floor(Math.random()*6)];
      ticks++;
      if(ticks>=maxTicks){
        clearInterval(tickTimer);
        diceEl.classList.remove("rolling");
        const roll = rollFinalValue();
        diceEl.textContent = DICE_FACES[roll-1];
        diceEl.classList.add("settle");
        setTimeout(()=>diceEl.classList.remove("settle"), 420);
        const steps = capStepsAtOfficer(stepsForRoll(roll));
        if((state.currentMap===4 || state.currentMap===9) && steps<=0){
          // 水/砂の抵抗が強すぎて1マスも進めない(出目が1の場合)。
          // 盤面上は移動が発生しない(現在のマスを再度resolveCell()しない)ため、
          // ここでは移動イベントを起こさず、専用のモーダルで「進めなかった」ことを伝えてターンを終える。
          hintEl.textContent = "";
          if(state.currentMap===4){
            showEvent(()=> showFlavor("🌊", t("waterStuckTitle"), t("waterStuckText", roll), endTurn));
          } else {
            showEvent(()=> showFlavor("🏜️", t("sandStuckTitle"), t("sandStuckText", roll), endTurn));
          }
          return;
        }
        if(state.currentMap===4){
          hintEl.textContent = t("rolledWaterMove", roll, steps);
        } else if(state.currentMap===9){
          hintEl.textContent = t("rolledSandMove", roll, steps);
        } else {
          hintEl.textContent = t("rolled", roll);
        }
        stepMove(steps, ()=>{ resolveCell(); });
      }
    }, 90);
  }

  /* =========================================================
     アカウント / Supabase連携（マジックリンクログイン・進行状況の保存）
     - REST APIを直接fetchで叩く実装(SDK不要)。
     - ログインは任意。ログインしなくても遊べる(ゲストプレイ)。
     - ログインすると、進行状況が自動保存(デバウンス)され、次回訪問時に続きから再開できる。
  ========================================================= */
  const SUPABASE_URL = "https://hghymcaoburxnvzrfhki.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_9805k1U3xMtWgtyiW5lKVQ_IdLpjw2p";
  const AUTH_URL = SUPABASE_URL + "/auth/v1";
  const REST_URL = SUPABASE_URL + "/rest/v1";
  const REFRESH_TOKEN_KEY = "adv_refresh_token";
  const MAP_KEY = "map1";

  const auth = { accessToken:null, refreshToken:null, user:null, lastSavedAt:null };
  const accountBtn = document.getElementById("accountBtn");

  function persistRefreshToken(){
    try{
      if(auth.refreshToken){ localStorage.setItem(REFRESH_TOKEN_KEY, auth.refreshToken); }
      else { localStorage.removeItem(REFRESH_TOKEN_KEY); }
    }catch(e){ /* localStorageが使えない環境では無視してゲストプレイを継続 */ }
  }

  function updateAccountBtnState(){
    if(accountBtn) accountBtn.classList.toggle("logged-in", !!auth.user);
  }

  async function authRequest(path, body){
    const res = await fetch(AUTH_URL + path, {
      method:"POST",
      headers:{ "apikey":SUPABASE_ANON_KEY, "Content-Type":"application/json" },
      body: JSON.stringify(body||{})
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok){ throw new Error(data.error_description || data.msg || data.error || ("HTTP "+res.status)); }
    return data;
  }

  async function fetchAuthUser(){
    if(!auth.accessToken) return null;
    try{
      const res = await fetch(AUTH_URL + "/user", {
        headers:{ "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+auth.accessToken }
      });
      if(!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }

  async function setSessionFromTokens(accessToken, refreshToken){
    auth.accessToken = accessToken;
    auth.refreshToken = refreshToken;
    persistRefreshToken();
    auth.user = await fetchAuthUser();
    updateAccountBtnState();
  }

  async function restoreSessionFromLocal(){
    let refreshToken = null;
    try{ refreshToken = localStorage.getItem(REFRESH_TOKEN_KEY); }catch(e){}
    if(!refreshToken) return false;
    try{
      const data = await authRequest("/token?grant_type=refresh_token", { refresh_token: refreshToken });
      await setSessionFromTokens(data.access_token, data.refresh_token);
      return !!auth.user;
    }catch(e){
      try{ localStorage.removeItem(REFRESH_TOKEN_KEY); }catch(e2){}
      return false;
    }
  }

  // マジックリンクをクリックして戻ってきた時、URLの#にトークンが付与される。それを読み取ってログイン状態にする。
  async function handleMagicLinkRedirect(){
    const hash = window.location.hash;
    if(!hash || hash.indexOf("access_token") === -1) return false;
    const params = new URLSearchParams(hash.slice(1));
    const accessToken = params.get("access_token");
    const refreshToken = params.get("refresh_token");
    history.replaceState(null, "", window.location.pathname + window.location.search);
    if(!accessToken || !refreshToken) return false;
    try{
      await setSessionFromTokens(accessToken, refreshToken);
      return !!auth.user;
    }catch(e){ return false; }
  }

    return authRequest("/otp", {
      email: email,
      create_user: true,
      options: { email_redirect_to: window.location.href.split("#")[0] }
    });
  }

    }
    auth.accessToken = null; auth.refreshToken = null; auth.user = null; auth.lastSavedAt = null;

  async function saveProgress(){

    try{
      const res = await fetch(REST_URL + "/game_saves", {
        method:"POST",
        headers:{
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":"Bearer "+auth.accessToken,
          "Content-Type":"application/json",
          "Prefer":"resolution=merge-duplicates"
        },
        body: JSON.stringify([{
          user_id: auth.user.id,
          map_key: MAP_KEY,
          state: captureStateSnapshot(),
          updated_at: new Date().toISOString()
        }])
      });
      if(!res.ok) return false;
      auth.lastSavedAt = new Date();
      return true;
    }catch(e){ return false; }
  }

        headers:{ "apikey":SUPABASE_ANON_KEY, "Authorization":"Bearer "+auth.accessToken }
      });
      if(!res.ok) return null;
      const rows = await res.json();
      return (rows && rows[0]) ? rows[0] : null;
    }catch(e){ return null; }
  }

  /* =========================================================
     BGM(背景音楽)
     - ブラウザの自動再生制限により、ユーザーの最初の操作(クリック/タップ/キー入力)
       をきっかけに再生を開始する。
     - 🔊/🔇ボタンでいつでもミュート切り替え可能。
  ========================================================= */
  const bgmEl = document.getElementById("bgm");
  const bgmSourceEl = document.getElementById("bgmSource");
  const bgmBtn = document.getElementById("bgmBtn");
  let bgmStarted = false;
  // 管理者ユーティリティ「🎵 BGMを楽しむ」画面を開いている間だけtrueにするフラグ(2026-08-24追加)。
  // このフラグが立っている間は、ページ上の任意のクリック等で発火するstartBgmOnce()による
  // ゲーム本編BGMの再開を止める(試聴中に不意にゲーム本編のBGMが鳴りだしてしまうのを防ぐ)。
  let suppressGameBgmForPreview = false;
  bgmEl.volume = 0.35;

  // 画面(オープニング/マップ)に応じてBGMの曲を切り替える。
  // 再生中であれば同じ再生状態を保ったまま新しい曲に差し替える。
  // マップ番号に対応するBGMファイルのパスを返す(マップごとの命名規則: public/audio/map{N}_bgm.mp3)
  function bgmPathForMap(mapNum){
    return "public/audio/map"+mapNum+"_bgm.mp3";
  }

  // 特殊イベント用BGMのパス。幹部(中ボス)戦・ドラゴン(最終ボス)戦・ゴール後・エンディング用。
  // 2026-08-23(22回目): マップ10(魔王城)・ドラゴン戦・エンディング本体の実装に伴い、
  // wedding(結婚エンディング)・opening(再び冒険に出る選択時、オープニング曲に戻す)を追加。
  const SPECIAL_BGM = {
    officerBattle: "public/audio/enemy_bgm.mp3",
    dragonBattle: "public/audio/dragon_bgm.mp3",
    goal: "public/audio/goal_bgm.mp3",
    ending: "public/audio/ending_bgm.mp3",
    wedding: "public/audio/wedding_bgm.mp3",
    opening: "public/audio/opening_bgm.mp3",
  };

  // 管理者ユーティリティ「🎵 BGMを楽しむ」用(2026-08-24追加): ゲーム中で使われている
  // 全BGMファイルの一覧。上のbgmPathForMap()/SPECIAL_BGMと同じファイルパスを、
  // 管理者向けの分かりやすいラベル付きでまとめたもの(マップ名は各言語のsubtitleMapNキーと
  // 対応する日本語名)。
  const BGM_LIBRARY = [
    { label:"オープニング", file: SPECIAL_BGM.opening },
    { label:"マップ1：王城の城下町", file: bgmPathForMap(1) },
    { label:"マップ2：草原", file: bgmPathForMap(2) },
    { label:"マップ3：洞窟", file: bgmPathForMap(3) },
    { label:"マップ4：水のエリア", file: bgmPathForMap(4) },
    { label:"マップ5：炎のエリア", file: bgmPathForMap(5) },
    { label:"マップ6：雪山", file: bgmPathForMap(6) },
    { label:"マップ7：天上界", file: bgmPathForMap(7) },
    { label:"マップ8：密林", file: bgmPathForMap(8) },
    { label:"マップ9：砂漠", file: bgmPathForMap(9) },
    { label:"マップ10：魔王城", file: bgmPathForMap(10) },
    { label:"幹部(中ボス)戦", file: SPECIAL_BGM.officerBattle },
    { label:"ドラゴン(ラスボス)戦", file: SPECIAL_BGM.dragonBattle },
    { label:"ゴールファンファーレ", file: SPECIAL_BGM.goal },
    { label:"エンディング(姫の救出)", file: SPECIAL_BGM.ending },
    { label:"結婚エンディング", file: SPECIAL_BGM.wedding },
  ];

  function switchBgmTrack(path){
    if(bgmSourceEl.getAttribute("src") === path) return;
    // 「切り替え直前に本当に再生中だったか」だけで判定すると、load()直後の一瞬paused状態に
    // なっている等のタイミング次第でfalseと誤判定されることがあるため、
    // 「BGMを一度でも開始しておりミュートもしていない」を条件に、常に鳴らし続ける前提で再生を試みる。
    const shouldPlay = bgmStarted && !bgmEl.muted;
    bgmSourceEl.src = path;
    bgmEl.load();
    if(shouldPlay){
      bgmEl.play().catch(()=>{});
    }
  }

  function startBgmOnce(){
    if(bgmStarted) return;
    bgmStarted = true;
    if(!bgmEl.muted && !suppressGameBgmForPreview){
      bgmEl.play().catch(()=>{ /* 自動再生がブロックされた場合は次の操作まで待つ */ bgmStarted = false; });
    }
  }
  // スマートフォン(特にiOS Safari等)ではpointerdownイベントがタップ操作で
  // 期待通りに発火しない端末・OSバージョンが存在するため、touchstart/touchend/mousedown/click
  // も含め複数のイベント種別を監視し、どれか1つでも発火した最初の操作でBGMを開始できるようにする
  // (startBgmOnce自体はbgmStartedフラグで多重発火しても安全)。
  ["pointerdown","touchstart","touchend","mousedown","click","keydown"].forEach(evName=>{
    document.addEventListener(evName, startBgmOnce, {once:false, passive:true});
  });

  // 音声ファイルの読み込みに失敗した場合(ファイル未配置・パス誤り・ファイル破損等)は
  // ブラウザのdevtoolsコンソールに原因調査用のログを残す(ユーザー向けの表示は変えない)。
  bgmEl.addEventListener("error", ()=>{
    console.warn("[BGM] failed to load:", bgmSourceEl.getAttribute("src"), bgmEl.error && bgmEl.error.code);
  });

  function updateBgmBtn(){
    bgmBtn.textContent = bgmEl.muted ? "🔇" : "🔊";
    bgmBtn.classList.toggle("muted", bgmEl.muted);
  }
  bgmBtn.addEventListener("click", ()=>{
    bgmEl.muted = !bgmEl.muted;
    updateBgmBtn();
    if(!bgmEl.muted){ bgmStarted = false; startBgmOnce(); }
  });
  updateBgmBtn();
